<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradOAuth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Exploit Card Gradient -->
    <linearGradient id="cardGradExploit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0716"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Target Server Card Gradient -->
    <linearGradient id="cardGradServer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14233A"/>
      <stop offset="100%" stop-color="#0D1625"/>
    </linearGradient>

    <!-- Glow & Shadows -->
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="mCyan" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#38BDF8"/>
    </marker>
    <marker id="mAmber" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#F59E0B"/>
    </marker>
    <marker id="mRose" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#F43F5E"/>
    </marker>
    <marker id="mGreen" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#10B981"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .code-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #CBD5E1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; font-weight: 700; }
    .step-badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1080" height="620" rx="16" fill="url(#bgGradOAuth)"/>
  <rect width="1080" height="620" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Top Header Banner -->
  <g transform="translate(48, 32)">
    <rect x="0" y="0" width="130" height="22" rx="11" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1"/>
    <text x="65" y="15" text-anchor="middle" class="badge" fill="#38BDF8">OAUTH 2.0 LAB</text>
    <text x="145" y="17" class="title" font-size="19">Authentication Bypass via Flawed Implicit Flow</text>
    <text x="0" y="40" class="subtitle" font-size="12">Anatomi Celah Client-Side Trust: Manipulasi Parameter Email di Burp Suite Repeater</text>
  </g>

  <!-- ================================================================= -->
  <!-- CARD 1: TOP LEFT - ATTACKER BROWSER (WIENER)                      -->
  <!-- ================================================================= -->
  <g transform="translate(48, 92)" filter="url(#shadowBox)">
    <rect width="440" height="190" rx="12" fill="url(#cardGradDark)" stroke="#38BDF8" stroke-width="1.2"/>
    <path d="M 0 12 Q 0 0 12 0 L 428 0 Q 440 0 440 12 L 440 32 L 0 32 Z" fill="#0F172A" />
    <circle cx="16" cy="16" r="4" fill="#EF4444"/>
    <circle cx="28" cy="16" r="4" fill="#F59E0B"/>
    <circle cx="40" cy="16" r="4" fill="#10B981"/>
    <text x="56" y="20" class="card-title" font-size="11.5" fill="#E2E8F0">Browser Penyerang (User: wiener)</text>

    <!-- Sub-boxes inside Browser -->
    <g transform="translate(16, 44)">
      <!-- Left subbox: incoming token -->
      <rect width="195" height="130" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="20" class="badge" fill="#38BDF8">STATUS LOGIN WIENER</text>
      <text x="10" y="38" class="desc-text">• User: <tspan fill="#38BDF8" font-weight="700">wiener:peter</tspan></text>
      <text x="10" y="56" class="desc-text">• Email: <tspan fill="#94A3B8">wiener@normal-user.net</tspan></text>
      <text x="10" y="74" class="desc-text">• Menerima Token Sah:</text>
      <rect x="10" y="82" width="175" height="38" rx="4" fill="#0C4A6E" fill-opacity="0.3" stroke="#0284C7" stroke-width="0.8"/>
      <text x="16" y="98" class="code-text" fill="#7DD3FC">access_token=vN3a0bL4c9...</text>
      <text x="16" y="112" class="desc-text" font-size="9" fill="#93C5FD">Token mendarat via URL Hash</text>

      <!-- Right subbox: Action -->
      <g transform="translate(205, 0)">
        <rect width="203" height="130" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
        <text x="10" y="20" class="badge" fill="#F59E0B">PROSES CLIENT JAVASCRIPT</text>
        <text x="10" y="38" class="desc-text">1. Baca hash `#access_token`</text>
        <text x="10" y="56" class="desc-text">2. Fetch `/userinfo` ke IdP</text>
        <text x="10" y="74" class="desc-text">3. Siapkan request POST:</text>
        <rect x="10" y="82" width="183" height="38" rx="4" fill="#1E293B" stroke="#475569" stroke-width="0.8"/>
        <text x="16" y="98" class="code-text" fill="#CBD5E1">POST /authenticate</text>
        <text x="16" y="112" class="desc-text" font-size="9" fill="#FDE047">Kirim token &amp; email ke backend</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CARD 2: TOP RIGHT - OAUTH SERVICE PROVIDER (IDP)                  -->
  <!-- ================================================================= -->
  <g transform="translate(592, 92)" filter="url(#shadowBox)">
    <rect width="440" height="190" rx="12" fill="url(#cardGradDark)" stroke="#0284C7" stroke-width="1.2"/>
    <path d="M 0 12 Q 0 0 12 0 L 428 0 Q 440 0 440 12 L 440 32 L 0 32 Z" fill="#082F49" />
    <text x="16" y="20" class="card-title" font-size="11.5" fill="#BAE6FD">OAuth 2.0 Service Provider (Identity Provider)</text>

    <g transform="translate(16, 44)">
      <rect width="408" height="60" rx="6" fill="#090D16" stroke="#0369A1" stroke-width="1"/>
      <text x="12" y="20" class="badge" fill="#38BDF8">AUTORISASI &amp; ISSUANCE TOKEN</text>
      <text x="12" y="38" class="desc-text">• Memvalidasi kredensial login akun media sosial <tspan fill="#38BDF8" font-weight="700">wiener:peter</tspan></text>
      <text x="12" y="52" class="desc-text">• Mengembalikan token otentik via HTTP 302 Redirect (URL Fragment)</text>

      <rect y="70" width="408" height="60" rx="6" fill="#090D16" stroke="#047857" stroke-width="1"/>
      <text x="12" y="90" class="badge" fill="#34D399">ENDPOINT /userinfo</text>
      <text x="12" y="108" class="desc-text">• Mengembalikan data profil asli: <tspan fill="#86EFAC">{"email": "wiener@normal-user.net"}</tspan></text>
      <text x="12" y="122" class="desc-text" fill="#6EE7B7">✓ OAuth Provider berfungsi normal (Kelemahan bukan pada IdP!)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CONNECTIONS BETWEEN TOP CARDS (BROWSER <-> OAUTH PROVIDER)        -->
  <!-- ================================================================= -->
  <!-- Line 1: Browser -> OAuth Provider (Login) -->
  <path d="M 488 140 L 584 140" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#mCyan)"/>
  <rect x="496" y="116" width="88" height="20" rx="4" fill="#0C4A6E" stroke="#0284C7" stroke-width="0.8"/>
  <text x="540" y="130" text-anchor="middle" class="step-badge" fill="#7DD3FC">1. /auth Login</text>

  <!-- Line 2: OAuth Provider -> Browser (Token Fragment) -->
  <path d="M 592 205 L 496 205" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#mAmber)"/>
  <rect x="496" y="210" width="88" height="20" rx="4" fill="#451A03" stroke="#B45309" stroke-width="0.8"/>
  <text x="540" y="224" text-anchor="middle" class="step-badge" fill="#FDE68A">2. #token Hash</text>


  <!-- ================================================================= -->
  <!-- CARD 3: BOTTOM LEFT - BURP SUITE REPEATER (EXPLOIT INTERCEPT)     -->
  <!-- ================================================================= -->
  <g transform="translate(48, 335)" filter="url(#shadowBox)">
    <rect width="440" height="250" rx="12" fill="url(#cardGradExploit)" stroke="#F43F5E" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 428 0 Q 440 0 440 12 L 440 32 L 0 32 Z" fill="#4C0519" />
    <text x="16" y="20" class="card-title" font-size="11.5" fill="#FECDD3">Titik Eksploitasi: Burp Suite Repeater (Parameter Tampering)</text>

    <!-- Request HTTP Box -->
    <g transform="translate(16, 44)">
      <rect width="408" height="186" rx="6" fill="#0B0205" stroke="#881337" stroke-width="1"/>
      <text x="14" y="20" class="badge" fill="#FB7185">INTERCEPTED: POST /authenticate HTTP/1.1</text>
      <text x="14" y="38" class="code-text" fill="#94A3B8">Host: lab-target.web-security-academy.net</text>
      <text x="14" y="52" class="code-text" fill="#94A3B8">Content-Type: application/json</text>

      <line x1="14" y1="62" x2="394" y2="62" stroke="#881337" stroke-width="0.8"/>

      <!-- JSON Body with Strikethrough & Tampering -->
      <text x="14" y="80" class="code-text" fill="#E2E8F0">{</text>
      
      <rect x="24" y="86" width="220" height="18" fill="#4C0519" rx="3"/>
      <text x="30" y="99" class="code-text" fill="#F87171" text-decoration="line-through">"email": "wiener@normal-user.net",</text>
      <text x="250" y="99" class="badge" fill="#F87171">← Hapus Email Wiener</text>

      <rect x="24" y="108" width="235" height="20" fill="#064E3B" stroke="#10B981" stroke-width="1" rx="3"/>
      <text x="30" y="122" class="code-text" fill="#34D399" font-weight="700">"email": "carlos@carlos-montoya.net",</text>
      <text x="268" y="122" class="badge" fill="#34D399">← Ganti Email Carlos!</text>

      <text x="30" y="142" class="code-text" fill="#E2E8F0">"username": "carlos",</text>
      <text x="30" y="158" class="code-text" fill="#FBBF24">"token": "vN3a0bL4c9..."</text>
      <text x="160" y="158" class="desc-text" font-size="9" fill="#FDE68A">(Token asli milik Wiener)</text>
      <text x="14" y="174" class="code-text" fill="#E2E8F0">}</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CARD 4: BOTTOM RIGHT - TARGET CLIENT BACKEND                      -->
  <!-- ================================================================= -->
  <g transform="translate(592, 335)" filter="url(#shadowBox)">
    <rect width="440" height="250" rx="12" fill="url(#cardGradServer)" stroke="#10B981" stroke-width="1.2"/>
    <path d="M 0 12 Q 0 0 12 0 L 428 0 Q 440 0 440 12 L 440 32 L 0 32 Z" fill="#064E3B" />
    <text x="16" y="20" class="card-title" font-size="11.5" fill="#A7F3D0">Target Client Application Backend (/authenticate)</text>

    <g transform="translate(16, 44)">
      <!-- Vulnerability Explanation -->
      <rect width="408" height="88" rx="6" fill="#090D16" stroke="#B45309" stroke-width="1"/>
      <text x="14" y="20" class="badge" fill="#F59E0B">AKAR MASALAH (ROOT CAUSE: BLIND TRUST)</text>
      <text x="14" y="38" class="desc-text">1. Server membaca <tspan fill="#F43F5E" font-weight="700">req.body.email</tspan> tanpa validasi silang ke IdP.</text>
      <text x="14" y="54" class="desc-text">2. Server menganggap ada token = user terotentikasi sah.</text>
      <text x="14" y="70" class="desc-text">3. Server <tspan fill="#F87171" font-weight="700">TIDAK memeriksa</tspan> apakah token milik Wiener atau Carlos!</text>

      <!-- Successful Exploitation -->
      <rect y="98" width="408" height="88" rx="6" fill="#064E3B" fill-opacity="0.25" stroke="#10B981" stroke-width="1"/>
      <text x="14" y="118" class="badge" fill="#34D399">RESPONS SERVER TARGET (SUKSES MEMBAJAK)</text>
      <text x="14" y="136" class="code-text" fill="#86EFAC">HTTP/1.1 200 OK</text>
      <text x="14" y="152" class="code-text" fill="#34D399">Set-Cookie: session=CarlosValidSessionCookie</text>
      <text x="14" y="170" class="desc-text" fill="#6EE7B7">✓ Penyerang otomatis login sebagai Carlos tanpa password!</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CONNECTIONS: VERTICAL & BOTTOM PATHS                              -->
  <!-- ================================================================= -->
  <!-- Step 3: Browser -> Burp Suite (Going Down) -->
  <path d="M 160 282 L 160 327" fill="none" stroke="#F43F5E" stroke-width="2.2" marker-end="url(#mRose)"/>
  <rect x="170" y="293" width="165" height="20" rx="4" fill="#4C0519" stroke="#E11D48" stroke-width="0.8"/>
  <text x="252" y="307" text-anchor="middle" class="step-badge" fill="#FDA4AF">3. Intercept POST /authenticate</text>

  <!-- Step 4: Burp Suite -> Target Server (Horizontal Forward) -->
  <path d="M 488 460 L 584 460" fill="none" stroke="#F43F5E" stroke-width="2.5" marker-end="url(#mRose)"/>
  <rect x="496" y="435" width="88" height="22" rx="4" fill="#881337" stroke="#F43F5E" stroke-width="1"/>
  <text x="540" y="450" text-anchor="middle" class="step-badge" fill="#FFF1F2">4. Forward</text>
  <text x="540" y="475" text-anchor="middle" class="desc-text" font-size="9" fill="#FDA4AF">Tampered Email</text>

  <!-- Step 5: Return to Browser (Curved Path on Right Edge) -->
  <path d="M 1000 335 C 1030 250, 520 270, 488 245" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mGreen)"/>
  <rect x="740" y="295" width="220" height="22" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="0.8"/>
  <text x="850" y="310" text-anchor="middle" class="step-badge" fill="#A7F3D0">5. Session Cookie Carlos Diterbitkan</text>
</svg>
