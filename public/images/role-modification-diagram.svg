<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Card Background Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="repeaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="adminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#500724"/>
    </linearGradient>

    <!-- Glow Accents -->
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F97316"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10B981"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .code-text { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #CBD5E1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; }
  </style>

  <!-- Background Base -->
  <rect width="1080" height="560" rx="16" fill="url(#bgGrad)"/>
  <rect width="1080" height="560" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Grid Line Pattern -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="80" x2="1080" y2="80"/>
    <line x1="0" y1="160" x2="1080" y2="160"/>
    <line x1="0" y1="240" x2="1080" y2="240"/>
    <line x1="0" y1="320" x2="1080" y2="320"/>
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="120" y1="0" x2="120" y2="560"/>
    <line x1="240" y1="0" x2="240" y2="560"/>
    <line x1="360" y1="0" x2="360" y2="560"/>
    <line x1="480" y1="0" x2="480" y2="560"/>
    <line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="720" y1="0" x2="720" y2="560"/>
    <line x1="840" y1="0" x2="840" y2="560"/>
    <line x1="960" y1="0" x2="960" y2="560"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(48, 44)">
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-width="1"/>
    <text x="67" y="16" text-anchor="middle" class="badge" fill="#F97316">MASS ASSIGNMENT</text>
    <text x="150" y="18" class="title" font-size="20">Eskalasi Hak Akses: Modifikasi Role via Burp Repeater</text>
    <text x="0" y="42" class="subtitle" font-size="13">Eksploitasi parameter tersembunyi (roleid) pada fitur Update Profil untuk menjadi Administrator</text>
  </g>

  <!-- ==================== LEFT CARD: BURP REPEATER ==================== -->
  <g transform="translate(48, 120)" filter="url(#cardShadow)">
    <rect width="320" height="400" rx="14" fill="url(#repeaterGrad)" stroke="#818CF8" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="18" y="18" width="38" height="38" rx="8" fill="#4338CA" fill-opacity="0.3" stroke="#818CF8" stroke-width="1.5"/>
    <path d="M28 32 L36 24 L44 32 M36 26 V44" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#A5B4FC">Burp Suite Repeater</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#94A3B8">Injeksi Parameter Tambahan</text>

    <line x1="18" y1="68" x2="302" y2="68" stroke="#334155" stroke-width="1"/>

    <!-- Request HTTP Box -->
    <rect x="16" y="80" width="288" height="195" rx="8" fill="#090D16" stroke="#3730A3" stroke-width="1"/>
    <text x="26" y="100" class="badge" fill="#818CF8">HTTP REQUEST (MODIFIED)</text>
    
    <text x="26" y="122" class="code-text" fill="#38BDF8">POST /my-account/change-email</text>
    <text x="26" y="138" class="code-text" fill="#94A3B8">Host: target-lab.net</text>
    <text x="26" y="154" class="code-text" fill="#94A3B8">Content-Type: application/json</text>
    <text x="26" y="176" class="code-text" fill="#CBD5E1">{</text>
    <text x="36" y="194" class="code-text" fill="#CBD5E1">"email": "user@target.net",</text>
    
    <!-- Highlighted Injected Line -->
    <rect x="24" y="202" width="270" height="24" rx="4" fill="#7C2D12" stroke="#EA580C" stroke-width="1"/>
    <text x="36" y="218" class="code-text" fill="#FED7AA">"roleid": 2</text>
    <text x="140" y="218" class="badge" fill="#F97316">← INJEKSI ADMIN ROLE</text>
    
    <text x="26" y="244" class="code-text" fill="#CBD5E1">}</text>

    <!-- Step Note -->
    <rect x="16" y="290" width="288" height="92" rx="8" fill="#1E1B4B" fill-opacity="0.5" stroke="#4F46E5" stroke-width="1"/>
    <text x="26" y="312" class="badge" fill="#A5B4FC">💡 TEMUAN DARI RESPONSE AWAL:</text>
    <text x="26" y="332" class="desc-text" font-size="11">Respons API sebelumnya membocorkan:</text>
    <text x="26" y="352" class="code-text" fill="#FDE047" font-size="11">"email": "...", "roleid": 1</text>
    <text x="26" y="368" class="desc-text" font-size="10.5" fill="#94A3B8">Mengindikasikan role diatur via angka 1=User, 2=Admin.</text>
  </g>

  <!-- ==================== CENTER CARD: VULNERABLE BACKEND ==================== -->
  <g transform="translate(400, 120)" filter="url(#cardShadow)">
    <rect width="330" height="400" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Server Icon & Header -->
    <rect x="18" y="18" width="38" height="38" rx="8" fill="#334155" stroke="#64748B" stroke-width="1"/>
    <path d="M26 28 h22 M26 34 h22 M26 40 h10" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#F8FAFC">Backend (Auto-Binding)</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#94A3B8">Mass Assignment Vulnerability</text>

    <line x1="18" y1="68" x2="312" y2="68" stroke="#334155" stroke-width="1"/>

    <!-- Vulnerable Logic Box -->
    <rect x="16" y="80" width="298" height="155" rx="8" fill="#450A0A" fill-opacity="0.3" stroke="#DC2626" stroke-width="1.2"/>
    <text x="26" y="100" class="badge" fill="#F87171">⚠️ KODE SERVER YANG RENTAN:</text>
    
    <text x="26" y="122" class="code-text" fill="#FCA5A5">// Langsung meng-update tanpa filter DTO</text>
    <text x="26" y="140" class="code-text" fill="#F8FAFC">await db.user.update({</text>
    <text x="36" y="158" class="code-text" fill="#F8FAFC">where: { id: req.user.id },</text>
    <rect x="30" y="165" width="268" height="22" rx="4" fill="#7F1D1D"/>
    <text x="36" y="180" class="code-text" fill="#FCA5A5" font-weight="700">data: req.body // ❌ BLIND UPDATE!</text>
    <text x="26" y="204" class="code-text" fill="#F8FAFC">});</text>
    <text x="26" y="222" class="desc-text" font-size="11" fill="#F87171">Parameter 'roleid' ikut masuk ke database!</text>

    <!-- Execution result -->
    <rect x="16" y="250" width="298" height="132" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="26" y="272" class="badge" fill="#FBBF24">HASIL UPDATE DATABASE:</text>
    
    <text x="26" y="296" class="code-text" fill="#6EE7B7">UPDATE users SET</text>
    <text x="26" y="314" class="code-text" fill="#6EE7B7">  email = 'user@target.net',</text>
    <text x="26" y="332" class="code-text" fill="#F87171" font-weight="700">  roleid = 2  /* PRIVILEGE ELEVATED! */</text>
    <text x="26" y="350" class="code-text" fill="#6EE7B7">WHERE id = 101;</text>
    <text x="26" y="370" class="desc-text" font-size="11" fill="#34D399">✓ Sukses tersimpan ke tabel pengguna</text>
  </g>

  <!-- ==================== RIGHT CARD: ELEVATED PRIVILEGE ==================== -->
  <g transform="translate(762, 120)" filter="url(#cardShadow)">
    <rect width="270" height="400" rx="14" fill="url(#adminGrad)" stroke="#F43F5E" stroke-width="1.5"/>
    
    <!-- Shield / Admin Icon & Header -->
    <circle cx="40" cy="38" r="20" fill="#9F1239" stroke="#FB7185" stroke-width="1.5"/>
    <path d="M40 26 L48 30 V38 C48 44 40 48 40 48 C40 48 32 44 32 38 V30 Z" fill="#FB7185"/>
    
    <text x="70" y="34" class="card-title" font-size="15" fill="#FFE4E6">Akses Admin Aktif</text>
    <text x="70" y="50" class="desc-text" font-size="11.5" fill="#FECDD3">Vertical Privilege Escalation</text>

    <line x1="18" y1="68" x2="252" y2="68" stroke="#9F1239" stroke-width="1"/>

    <!-- Admin Capabilities Box -->
    <rect x="16" y="80" width="238" height="185" rx="8" fill="#1C1917" fill-opacity="0.8" stroke="#BE123C" stroke-width="1"/>
    <text x="26" y="102" class="badge" fill="#FB7185">MENU ADMINISTRATOR:</text>
    
    <rect x="24" y="115" width="222" height="34" rx="6" fill="#881337" stroke="#F43F5E" stroke-width="1"/>
    <text x="34" y="136" class="code-text" fill="#FFFFFF">/admin (Admin Panel)</text>
    
    <text x="26" y="170" class="item-text" fill="#FECDD3">• Akses Manajemen Pengguna</text>
    <text x="26" y="190" class="item-text" fill="#FECDD3">• Hapus Akun Korban (Carlos)</text>
    <text x="26" y="210" class="item-text" fill="#FECDD3">• Ubah Konfigurasi Sistem</text>
    <text x="26" y="230" class="item-text" fill="#FECDD3">• Ekspor Seluruh Data Aplikasi</text>

    <!-- Lab Solved Pill -->
    <rect x="16" y="280" width="238" height="102" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" filter="url(#glowGreen)"/>
    <text x="135" y="306" text-anchor="middle" class="badge" fill="#A7F3D0">🎉 STATUS: LAB SOLVED</text>
    <text x="135" y="330" text-anchor="middle" class="desc-text" font-size="11.5" fill="#ECFDF5">Penyerang berhasil login &amp;</text>
    <text x="135" y="348" text-anchor="middle" class="desc-text" font-size="11.5" fill="#ECFDF5">menjalankan aksi admin</text>
    <text x="135" y="366" text-anchor="middle" class="desc-text" font-size="11" fill="#6EE7B7">(Delete User Carlos)</text>
  </g>

  <!-- Flow Arrows -->
  <!-- 1. Repeater -> Server -->
  <path d="M 368 250 L 400 250" fill="none" stroke="#F97316" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrowOrange)" filter="url(#glowOrange)"/>
  
  <!-- 2. Server -> Admin Panel -->
  <path d="M 730 250 L 762 250" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrowGreen)" filter="url(#glowGreen)"/>

</svg>
