<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="evilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C0519"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowRose" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F43F5E"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10B981"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .code-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #CBD5E1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 700; }
  </style>

  <!-- Background Base -->
  <rect width="1080" height="560" rx="16" fill="url(#bgGrad)"/>
  <rect width="1080" height="560" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="80" x2="1080" y2="80"/>
    <line x1="0" y1="160" x2="1080" y2="160"/>
    <line x1="0" y1="240" x2="1080" y2="240"/>
    <line x1="0" y1="320" x2="1080" y2="320"/>
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="180" y1="0" x2="180" y2="560"/>
    <line x1="360" y1="0" x2="360" y2="560"/>
    <line x1="540" y1="0" x2="540" y2="560"/>
    <line x1="720" y1="0" x2="720" y2="560"/>
    <line x1="900" y1="0" x2="900" y2="560"/>
  </g>

  <!-- Header -->
  <g transform="translate(48, 40)">
    <rect x="0" y="0" width="155" height="24" rx="12" fill="#F43F5E" fill-opacity="0.15" stroke="#F43F5E" stroke-width="1"/>
    <text x="77" y="16" text-anchor="middle" class="badge" fill="#FB7185">CSRF ANATOMY</text>
    <text x="170" y="18" class="title" font-size="20">Cross-Site Request Forgery (CSRF): Konsep &amp; Alur Serangan</text>
    <text x="0" y="42" class="subtitle" font-size="13">Mengapa bug CSRF terjadi? Eksploitasi perilaku browser yang otomatis menyertakan session cookie</text>
  </g>

  <!-- ==================== ACTOR 1: VICTIM (BROWSER) ==================== -->
  <g transform="translate(48, 115)" filter="url(#cardShadow)">
    <rect width="290" height="405" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    
    <!-- User Icon -->
    <circle cx="38" cy="38" r="20" fill="#0369A1" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="38" cy="33" r="7" fill="#38BDF8"/>
    <path d="M26 48 C26 42 31 39 38 39 C45 39 50 42 50 48" fill="#38BDF8"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#38BDF8">Korban (Victim)</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#94A3B8">Browser Pengguna Terotentikasi</text>

    <line x1="18" y1="68" x2="272" y2="68" stroke="#334155" stroke-width="1"/>

    <!-- State 1: Active Session -->
    <rect x="16" y="80" width="258" height="76" rx="8" fill="#090D16" stroke="#0284C7" stroke-width="1"/>
    <text x="26" y="98" class="badge" fill="#38BDF8">KONDISI 1: SUDAH LOGIN</text>
    <text x="26" y="118" class="code-text" fill="#CBD5E1">Cookie: <tspan fill="#34D399">session=user_active_981</tspan></text>
    <text x="26" y="136" class="desc-text" font-size="10.5" fill="#94A3B8">Tersimpan aman di cookie jar browser.</text>

    <!-- State 2: Visits Malicious Link -->
    <rect x="16" y="168" width="258" height="110" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="26" y="188" class="badge" fill="#F43F5E">KONDISI 2: MEMBUKA LINK JEBAKAN</text>
    <text x="26" y="208" class="desc-text" font-size="11">Korban mengklik link promo palsu</text>
    <text x="26" y="224" class="code-text" font-size="10" fill="#FDA4AF">https://evil-hacker.com/promo</text>
    <text x="26" y="244" class="desc-text" font-size="11">Halaman tersebut memuat script</text>
    <text x="26" y="260" class="desc-text" font-size="11">auto-submit form di latar belakang!</text>

    <!-- Behavior Box -->
    <rect x="16" y="290" width="258" height="100" rx="8" fill="#0C4A6E" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1"/>
    <text x="26" y="310" class="badge" fill="#7DD3FC">⚠️ PERILAKU DEFAULT BROWSER:</text>
    <text x="26" y="330" class="desc-text" font-size="11">Setiap request ke <tspan font-weight="700" fill="#38BDF8">target.com</tspan></text>
    <text x="26" y="348" class="desc-text" font-size="11">akan <tspan font-weight="700" fill="#FDE047">OTOMATIS menyertakan cookie</tspan></text>
    <text x="26" y="366" class="desc-text" font-size="11">milik korban tanpa izin eksplisit!</text>
  </g>

  <!-- ==================== ACTOR 2: ATTACKER SERVER (EVIL.COM) ==================== -->
  <g transform="translate(378, 115)" filter="url(#cardShadow)">
    <rect width="320" height="405" rx="14" fill="url(#evilGrad)" stroke="#F43F5E" stroke-width="1.5"/>
    
    <!-- Evil Icon -->
    <circle cx="38" cy="38" r="20" fill="#881337" stroke="#F43F5E" stroke-width="1.5"/>
    <path d="M28 32 L34 38 L28 44 M48 32 L42 38 L48 44" stroke="#FECDD3" stroke-width="2" stroke-linecap="round"/>
    <circle cx="38" cy="40" r="3" fill="#FECDD3"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#FECDD3">Situs Penyerang (evil.com)</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#F43F5E">Eksploitasi &amp; Forged Request</text>

    <line x1="18" y1="68" x2="302" y2="68" stroke="#881337" stroke-width="1"/>

    <!-- Exploit Code Box -->
    <rect x="16" y="80" width="288" height="155" rx="8" fill="#090D16" stroke="#881337" stroke-width="1"/>
    <text x="26" y="98" class="badge" fill="#FDA4AF">PAYLOAD CSRF POC (HTML HIDDEN FORM):</text>
    <text x="26" y="118" class="code-text" font-size="10" fill="#CBD5E1">&lt;form action="<tspan fill="#38BDF8">https://target.com/email</tspan>"</text>
    <text x="26" y="132" class="code-text" font-size="10" fill="#CBD5E1">      method="<tspan fill="#FDE047">POST</tspan>" id="csrf"&gt;</text>
    <text x="26" y="148" class="code-text" font-size="10" fill="#CBD5E1">  &lt;input type="hidden" name="email"</text>
    <text x="26" y="162" class="code-text" font-size="10" fill="#F43F5E">         value="hacker@evil.com" /&gt;</text>
    <text x="26" y="178" class="code-text" font-size="10" fill="#CBD5E1">&lt;/form&gt;</text>
    <text x="26" y="196" class="code-text" font-size="10" fill="#34D399">&lt;script&gt;document.getElementById('csrf').submit();&lt;/script&gt;</text>
    <text x="26" y="214" class="desc-text" font-size="9.5" fill="#FDA4AF">⚡ Auto-submit instan saat halaman dibuka!</text>

    <!-- Flaw Explanation -->
    <rect x="16" y="246" width="288" height="144" rx="8" fill="#1E1B4B" stroke="#4338CA" stroke-width="1"/>
    <text x="26" y="266" class="badge" fill="#A5B4FC">DI MANA LETAK BUG-NYA?</text>
    <text x="26" y="286" class="desc-text" font-size="11">1. <tspan font-weight="700" fill="#FCA5A5">Tidak Ada CSRF Token:</tspan> Server tidak</text>
    <text x="26" y="302" class="desc-text" font-size="11">   meminta kode rahasia unik per-request.</text>
    <text x="26" y="322" class="desc-text" font-size="11">2. <tspan font-weight="700" fill="#FCA5A5">Hanya Mengandalkan Cookie:</tspan> Server</text>
    <text x="26" y="338" class="desc-text" font-size="11">   mengira aksi ini dilakukan atas kemauan</text>
    <text x="26" y="354" class="desc-text" font-size="11">   korban karena cookie session-nya sah!</text>
  </g>

  <!-- ==================== ACTOR 3: TARGET SERVER (TARGET.COM) ==================== -->
  <g transform="translate(738, 115)" filter="url(#cardShadow)">
    <rect width="294" height="405" rx="14" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
    
    <!-- Server Icon -->
    <circle cx="38" cy="38" r="20" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <rect x="28" y="28" width="20" height="8" rx="2" fill="none" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="28" y="40" width="20" height="8" rx="2" fill="none" stroke="#6EE7B7" stroke-width="1.5"/>
    <circle cx="44" cy="32" r="1.5" fill="#6EE7B7"/>
    <circle cx="44" cy="44" r="1.5" fill="#6EE7B7"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#6EE7B7">Server Target (target.com)</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#94A3B8">Aplikasi Web Korban</text>

    <line x1="18" y1="68" x2="276" y2="68" stroke="#047857" stroke-width="1"/>

    <!-- Incoming Request -->
    <rect x="14" y="80" width="266" height="100" rx="8" fill="#090D16" stroke="#047857" stroke-width="1"/>
    <text x="24" y="98" class="badge" fill="#34D399">REQUEST YANG DITERIMA SERVER:</text>
    <text x="24" y="118" class="code-text" font-size="10" fill="#F8FAFC">POST /email HTTP/1.1</text>
    <text x="24" y="134" class="code-text" font-size="10" fill="#34D399">Cookie: session=user_active_981</text>
    <text x="24" y="150" class="code-text" font-size="10" fill="#FDA4AF">email=hacker@evil.com</text>
    <text x="24" y="168" class="desc-text" font-size="9.5" fill="#94A3B8">Server melihat cookie sah &amp; eksekusi!</text>

    <!-- Impact Box -->
    <rect x="14" y="192" width="266" height="198" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="212" class="badge" fill="#F43F5E">DAMPAK SERANGAN SUKSES:</text>
    
    <rect x="22" y="224" width="250" height="36" rx="4" fill="#881337" stroke="#F43F5E" stroke-width="1" filter="url(#glowRose)"/>
    <text x="28" y="240" class="code-text" font-size="10" fill="#FFF1F2">Email Akun Korban Berubah</text>
    <text x="28" y="254" class="code-text" font-size="9.5" fill="#FDA4AF">=&gt; hacker@evil.com</text>

    <text x="24" y="282" class="desc-text" font-size="11">3 Langkah Penyerang Selanjutnya:</text>
    <text x="24" y="300" class="desc-text" font-size="11">1. Minta Reset Password akun korban</text>
    <text x="24" y="316" class="desc-text" font-size="11">2. Link reset masuk ke email hacker</text>
    <text x="24" y="332" class="desc-text" font-size="11">3. <tspan font-weight="700" fill="#F43F5E">Akun korban berhasil diambil alih!</tspan></text>

    <text x="24" y="366" class="badge" fill="#34D399">✓ FULL ACCOUNT TAKEOVER</text>
  </g>

  <!-- Animated Connectors / Arrows -->
  <path d="M 338 230 L 378 230" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowRose)"/>
  <path d="M 698 230 L 738 230" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>

</svg>
