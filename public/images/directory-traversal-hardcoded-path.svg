<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10B981"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .code-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #CBD5E1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 700; }
  </style>

  <!-- Background Base -->
  <rect width="1080" height="560" rx="16" fill="url(#bgGrad)"/>
  <rect width="1080" height="560" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle Grid -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="80" x2="1080" y2="80"/>
    <line x1="0" y1="160" x2="1080" y2="160"/>
    <line x1="0" y1="240" x2="1080" y2="240"/>
    <line x1="0" y1="320" x2="1080" y2="320"/>
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="180" y1="0" x2="180" y2="560"/>
    <line x1="360" y1="0" x2="360" y2="560"/>
    <line x1="540" y1="0" x2="540" y2="560"/>
    <line x1="720" y1="0" x2="720" y2="560"/>
    <line x1="900" y1="0" x2="900" y2="560"/>
  </g>

  <!-- Header -->
  <g transform="translate(48, 40)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <text x="82" y="16" text-anchor="middle" class="badge" fill="#10B981">HARDCODED PATH BYPASS</text>
    <text x="180" y="18" class="title" font-size="20">Directory Traversal: Bypassing Hardcoded Base Path</text>
    <text x="0" y="42" class="subtitle" font-size="13">Mekanisme keluar dari direktori dasar (/var/www/images/) melalui Prefix Fulfillment &amp; Depth Climbing</text>
  </g>

  <!-- ==================== LEFT CARD: HARDCODED BASE PATH SCENARIOS ==================== -->
  <g transform="translate(48, 115)" filter="url(#cardShadow)">
    <rect width="310" height="405" rx="14" fill="url(#cardGrad)" stroke="#64748B" stroke-width="1.5"/>
    
    <circle cx="38" cy="38" r="20" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    <path d="M28 32 H36 L40 36 H48 V46 H28 Z" fill="none" stroke="#94A3B8" stroke-width="2"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#F8FAFC">1. Hardcoded Base Path</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#94A3B8">Pola Path Terkunci di Backend</text>

    <line x1="18" y1="68" x2="292" y2="68" stroke="#334155" stroke-width="1"/>

    <!-- Code Block -->
    <rect x="16" y="80" width="278" height="100" rx="8" fill="#090D16" stroke="#334155" stroke-width="1"/>
    <text x="26" y="98" class="badge" fill="#94A3B8">KODE PENGGABUNGAN JALUR:</text>
    <text x="26" y="120" class="code-text" fill="#CBD5E1">const BASE = <tspan fill="#38BDF8">"/var/www/images/"</tspan>;</text>
    <text x="26" y="138" class="code-text" fill="#CBD5E1">const file = req.query.filename;</text>
    <text x="26" y="158" class="code-text" fill="#FDE047">const target = BASE + file;</text>

    <!-- Tree Structure -->
    <rect x="16" y="192" width="278" height="198" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="26" y="212" class="badge" fill="#38BDF8">STRUKTUR KEDALAMAN POHON:</text>
    
    <text x="26" y="234" class="code-text" fill="#F43F5E">/ (Root OS)</text>
    <text x="36" y="254" class="code-text" fill="#CBD5E1">└── var/</text>
    <text x="46" y="274" class="code-text" fill="#CBD5E1">    └── www/</text>
    <text x="56" y="294" class="code-text" fill="#38BDF8">        └── images/ <tspan fill="#FDE047" font-size="10">(Base Folder)</tspan></text>
    
    <rect x="26" y="312" width="258" height="64" rx="6" fill="#1C1917" stroke="#334155" stroke-width="1"/>
    <text x="34" y="330" class="desc-text" font-size="11">Kedalaman dari Root = <tspan font-weight="700" fill="#38BDF8">3 Level</tspan></text>
    <text x="34" y="348" class="desc-text" font-size="11">Penyerang butuh minimal <tspan font-weight="700" fill="#F43F5E">3x "../"</tspan></text>
    <text x="34" y="364" class="desc-text" font-size="10.5" fill="#94A3B8">untuk naik kembali ke Root (/).</text>
  </g>

  <!-- ==================== CENTER CARD: METHOD 1: DEPTH CLIMBING ==================== -->
  <g transform="translate(385, 115)" filter="url(#cardShadow)">
    <rect width="320" height="405" rx="14" fill="url(#pathGrad)" stroke="#10B981" stroke-width="1.5"/>
    
    <circle cx="38" cy="38" r="20" fill="#047857" stroke="#34D399" stroke-width="1.5"/>
    <path d="M38 46 V28 M30 36 L38 28 L46 36" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#A7F3D0">2. Directory Climbing</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#6EE7B7">Mundur Keluar dari Base Path</text>

    <line x1="18" y1="68" x2="302" y2="68" stroke="#065F46" stroke-width="1"/>

    <!-- Payload Box -->
    <rect x="16" y="80" width="288" height="88" rx="8" fill="#022C22" stroke="#059669" stroke-width="1"/>
    <text x="26" y="100" class="badge" fill="#6EE7B7">PAYLOAD DI PARAMETER:</text>
    
    <rect x="24" y="112" width="272" height="26" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1" filter="url(#glowGreen)"/>
    <text x="32" y="129" class="code-text" fill="#ECFDF5">filename=../../../../etc/passwd</text>
    <text x="26" y="156" class="desc-text" font-size="11" fill="#A7F3D0">Gunakan depth ekstra (4-10x) untuk aman</text>

    <!-- Normalization Result -->
    <rect x="16" y="178" width="288" height="210" rx="8" fill="#090D16" stroke="#047857" stroke-width="1"/>
    <text x="26" y="200" class="badge" fill="#34D399">NORMALISASI OLEH SISTEM OPERASI:</text>
    
    <text x="26" y="224" class="desc-text" font-size="11.5">Hasil gabungan string di server:</text>
    <text x="26" y="242" class="code-text" font-size="10.5" fill="#CBD5E1">/var/www/images/<tspan fill="#34D399">../../../../</tspan>etc/passwd</text>

    <text x="26" y="268" class="desc-text" font-size="11.5">Langkah demi langkah kernel OS:</text>
    <text x="26" y="286" class="desc-text" font-size="11">1. /var/www/images/.. → <tspan fill="#FDE047">/var/www/</tspan></text>
    <text x="26" y="304" class="desc-text" font-size="11">2. /var/www/.. → <tspan fill="#FDE047">/var/</tspan></text>
    <text x="26" y="322" class="desc-text" font-size="11">3. /var/.. → <tspan fill="#34D399" font-weight="700">/ (Root OS)</tspan></text>
    <text x="26" y="340" class="desc-text" font-size="11">4. /.. → <tspan fill="#34D399">Tetap di / (Root)</tspan></text>

    <rect x="24" y="352" width="272" height="26" rx="4" fill="#064E3B" stroke="#34D399" stroke-width="1"/>
    <text x="32" y="369" class="code-text" fill="#ECFDF5">Target Akhir: "/etc/passwd"</text>
  </g>

  <!-- ==================== RIGHT CARD: METHOD 2: PREFIX VALIDATION BYPASS ==================== -->
  <g transform="translate(730, 115)" filter="url(#cardShadow)">
    <rect width="302" height="405" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    
    <circle cx="38" cy="38" r="20" fill="#0369A1" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M28 38 L36 44 L48 30" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <text x="68" y="34" class="card-title" font-size="15" fill="#38BDF8">3. Prefix Validation</text>
    <text x="68" y="50" class="desc-text" font-size="11.5" fill="#94A3B8">Bypass Validasi Awalan Path</text>

    <line x1="18" y1="68" x2="284" y2="68" stroke="#334155" stroke-width="1"/>

    <!-- Rule Box -->
    <rect x="14" y="80" width="274" height="88" rx="8" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="98" class="badge" fill="#FCA5A5">VALIDASI KETAT DI SERVER:</text>
    <text x="24" y="118" class="code-text" font-size="10.5" fill="#CBD5E1">if (!input.startsWith(</text>
    <text x="34" y="134" class="code-text" font-size="10.5" fill="#38BDF8">"/var/www/images/"</text>
    <text x="24" y="150" class="code-text" font-size="10.5" fill="#CBD5E1">)) return 403;</text>

    <!-- Exploit Trick -->
    <rect x="14" y="178" width="274" height="210" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <text x="24" y="198" class="badge" fill="#38BDF8">TRIK PENYERANG (PREFIX MATCH):</text>
    
    <text x="24" y="220" class="desc-text" font-size="11">Awali dengan prefix yang diminta,</text>
    <text x="24" y="236" class="desc-text" font-size="11">lalu langsung lompat keluar:</text>

    <rect x="22" y="248" width="258" height="42" rx="4" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1" filter="url(#glowCyan)"/>
    <text x="28" y="266" class="code-text" font-size="10" fill="#E0F2FE">/var/www/images/</text>
    <text x="28" y="280" class="code-text" font-size="10" fill="#FDE047">../../../etc/passwd</text>

    <text x="24" y="312" class="desc-text" font-size="11">1. startsWith() → <tspan fill="#34D399" font-weight="700">BENAR (Lolos!)</tspan></text>
    <text x="24" y="330" class="desc-text" font-size="11">2. Sekuens <tspan fill="#FDE047" font-weight="700">../../../</tspan> menembus root</text>
    <text x="24" y="348" class="desc-text" font-size="11">3. Berkas sistem <tspan fill="#38BDF8">/etc/passwd</tspan> terbaca</text>
    
    <text x="24" y="374" class="badge" fill="#34D399">✓ LAB RESOLVED (200 OK)</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M 358 250 L 385 250" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowGreen)"/>
  <path d="M 705 250 L 730 250" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>

</svg>
