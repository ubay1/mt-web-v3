<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="cardShadow2" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .code-text { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; }
    .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #CBD5E1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 700; }
  </style>

  <!-- Base Background -->
  <rect width="1080" height="560" rx="16" fill="url(#bgGrad2)"/>
  <rect width="1080" height="560" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Header -->
  <g transform="translate(48, 40)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
    <text x="82" y="16" text-anchor="middle" class="badge" fill="#FBBF24">CSRF TOKEN FLAWS</text>
    <text x="180" y="18" class="title" font-size="20">Katalog Celah &amp; Kelemahan Validasi CSRF Token</text>
    <text x="0" y="42" class="subtitle" font-size="13">4 jenis kesalahan implementasi validasi token di sisi backend yang memungkinkan serangan CSRF tetap terjadi</text>
  </g>

  <!-- ==================== CARD 1: METHOD DEPENDENT ==================== -->
  <g transform="translate(48, 115)" filter="url(#cardShadow2)">
    <rect width="230" height="405" rx="12" fill="url(#cardGrad2)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="18" y="32" class="card-title" font-size="14" fill="#38BDF8">1. Method Toggling</text>
    <text x="18" y="48" class="desc-text" font-size="10.5" fill="#94A3B8">POST → GET Switch</text>
    <line x1="18" y1="60" x2="212" y2="60" stroke="#334155" stroke-width="1"/>

    <!-- Content -->
    <rect x="14" y="70" width="202" height="75" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="88" class="badge" fill="#FCA5A5">CELAH DI SERVER:</text>
    <text x="22" y="106" class="desc-text" font-size="10.5">Validasi token hanya</text>
    <text x="22" y="122" class="desc-text" font-size="10.5">berjalan pada request <tspan font-weight="700" fill="#38BDF8">POST</tspan>.</text>
    <text x="22" y="138" class="desc-text" font-size="10.5">Request <tspan font-weight="700" fill="#FDE047">GET</tspan> tidak dicek!</text>

    <!-- Exploit Box -->
    <rect x="14" y="155" width="202" height="150" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <text x="22" y="175" class="badge" fill="#38BDF8">CARA TEST &amp; BYPASS:</text>
    <text x="22" y="195" class="desc-text" font-size="10.5">Ubah method request ke GET:</text>
    
    <rect x="20" y="205" width="190" height="42" rx="4" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1"/>
    <text x="24" y="220" class="code-text" font-size="9.5" fill="#E0F2FE">GET /email?email=</text>
    <text x="24" y="234" class="code-text" font-size="9.5" fill="#FDA4AF">hacker@evil.com</text>

    <text x="22" y="265" class="desc-text" font-size="10.5">Bisa dipicu via tag:</text>
    <text x="22" y="282" class="code-text" font-size="9.5" fill="#34D399">&lt;img src="https://..."&gt;</text>
    <text x="22" y="298" class="desc-text" font-size="10">tanpa interaksi form!</text>

    <!-- Status -->
    <rect x="14" y="318" width="202" height="70" rx="6" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1"/>
    <text x="22" y="338" class="badge" fill="#7DD3FC">✓ BYPASS SUKSES:</text>
    <text x="22" y="356" class="desc-text" font-size="10.5">Email korban berubah</text>
    <text x="22" y="372" class="desc-text" font-size="10.5">hanya dengan load gambar.</text>
  </g>

  <!-- ==================== CARD 2: TOKEN PRESENCE ==================== -->
  <g transform="translate(294, 115)" filter="url(#cardShadow2)">
    <rect width="230" height="405" rx="12" fill="url(#cardGrad2)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="18" y="32" class="card-title" font-size="14" fill="#FBBF24">2. Token Presence</text>
    <text x="18" y="48" class="desc-text" font-size="10.5" fill="#94A3B8">Hapus Parameter Token</text>
    <line x1="18" y1="60" x2="212" y2="60" stroke="#334155" stroke-width="1"/>

    <!-- Content -->
    <rect x="14" y="70" width="202" height="75" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="88" class="badge" fill="#FCA5A5">CELAH DI SERVER:</text>
    <text x="22" y="106" class="code-text" font-size="9.5" fill="#FDE047">if (req.body.csrf) {</text>
    <text x="32" y="122" class="code-text" font-size="9.5" fill="#CBD5E1">validate(csrf);</text>
    <text x="22" y="138" class="code-text" font-size="9.5" fill="#FDE047">}</text>

    <!-- Exploit Box -->
    <rect x="14" y="155" width="202" height="150" rx="6" fill="#0F172A" stroke="#D97706" stroke-width="1"/>
    <text x="22" y="175" class="badge" fill="#FBBF24">CARA TEST &amp; BYPASS:</text>
    <text x="22" y="195" class="desc-text" font-size="10.5">Hapus parameter `csrf`</text>
    <text x="22" y="210" class="desc-text" font-size="10.5">secara total dari request:</text>
    
    <rect x="20" y="222" width="190" height="38" rx="4" fill="#451A03" stroke="#F59E0B" stroke-width="1"/>
    <text x="24" y="237" class="code-text" font-size="9.5" fill="#FEF08A">email=hacker@evil.com</text>
    <text x="24" y="250" class="code-text" font-size="8.5" fill="#F87171">(csrf parameter dihapus!)</text>

    <text x="22" y="278" class="desc-text" font-size="10.5">Server menganggap validasi</text>
    <text x="22" y="294" class="desc-text" font-size="10.5">opsional dan memproses aksi!</text>

    <!-- Status -->
    <rect x="14" y="318" width="202" height="70" rx="6" fill="#D97706" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1"/>
    <text x="22" y="338" class="badge" fill="#FDE68A">✓ BYPASS SUKSES:</text>
    <text x="22" y="356" class="desc-text" font-size="10.5">Validasi terlewat karena</text>
    <text x="22" y="372" class="desc-text" font-size="10.5">kondisi if() bernilai false.</text>
  </g>

  <!-- ==================== CARD 3: TOKEN NOT TIED TO SESSION ==================== -->
  <g transform="translate(540, 115)" filter="url(#cardShadow2)">
    <rect width="240" height="405" rx="12" fill="url(#cardGrad2)" stroke="#A855F7" stroke-width="1.5"/>
    <text x="18" y="32" class="card-title" font-size="14" fill="#C084FC">3. Untied Session Token</text>
    <text x="18" y="48" class="desc-text" font-size="10.5" fill="#94A3B8">Pakai Token Milik Hacker</text>
    <line x1="18" y1="60" x2="222" y2="60" stroke="#334155" stroke-width="1"/>

    <!-- Content -->
    <rect x="14" y="70" width="212" height="75" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="88" class="badge" fill="#FCA5A5">CELAH DI SERVER:</text>
    <text x="22" y="106" class="desc-text" font-size="10.5">Server mengecek: "Apakah</text>
    <text x="22" y="122" class="desc-text" font-size="10.5">token ini ada di database?",</text>
    <text x="22" y="138" class="desc-text" font-size="10.5"><tspan font-weight="700" fill="#F43F5E">BUKAN</tspan> "Apakah milik korban?"</text>

    <!-- Exploit Box -->
    <rect x="14" y="155" width="212" height="150" rx="6" fill="#0F172A" stroke="#7C3AED" stroke-width="1"/>
    <text x="22" y="175" class="badge" fill="#C084FC">CARA TEST &amp; BYPASS:</text>
    <text x="22" y="195" class="desc-text" font-size="10.5">1. Hacker login ke akunnya</text>
    <text x="22" y="210" class="desc-text" font-size="10.5">2. Ambil token sah miliknya:</text>
    
    <rect x="20" y="218" width="200" height="24" rx="4" fill="#1E1B4B" stroke="#A855F7" stroke-width="1"/>
    <text x="24" y="234" class="code-text" font-size="9" fill="#E9D5FF">csrf=hacker_valid_token_xyz</text>

    <text x="22" y="258" class="desc-text" font-size="10.5">3. Tempelkan token tersebut</text>
    <text x="22" y="274" class="desc-text" font-size="10.5">ke form HTML jebakan korban!</text>
    <text x="22" y="294" class="desc-text" font-size="10">Server anggap token valid ✓</text>

    <!-- Status -->
    <rect x="14" y="318" width="212" height="70" rx="6" fill="#7C3AED" fill-opacity="0.1" stroke="#A855F7" stroke-width="1"/>
    <text x="22" y="338" class="badge" fill="#E9D5FF">✓ BYPASS SUKSES:</text>
    <text x="22" y="356" class="desc-text" font-size="10.5">Validasi pool token tembus</text>
    <text x="22" y="372" class="desc-text" font-size="10.5">karena tidak di-bind ke cookie.</text>
  </g>

  <!-- ==================== CARD 4: TIED TO NON-SESSION COOKIE ==================== -->
  <g transform="translate(796, 115)" filter="url(#cardShadow2)">
    <rect width="236" height="405" rx="12" fill="url(#cardGrad2)" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="18" y="32" class="card-title" font-size="14" fill="#FDA4AF">4. Non-Session Cookie</text>
    <text x="18" y="48" class="desc-text" font-size="10.5" fill="#94A3B8">Injeksi Pasangan Cookie</text>
    <line x1="18" y1="60" x2="218" y2="60" stroke="#334155" stroke-width="1"/>

    <!-- Content -->
    <rect x="14" y="70" width="208" height="75" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <text x="22" y="88" class="badge" fill="#FCA5A5">CELAH DI SERVER:</text>
    <text x="22" y="106" class="desc-text" font-size="10.5">Token dicek berpasangan</text>
    <text x="22" y="122" class="desc-text" font-size="10.5">dengan cookie <tspan font-weight="700" fill="#FDA4AF">csrfKey</tspan>,</text>
    <text x="22" y="138" class="desc-text" font-size="10.5">bukan dengan session login!</text>

    <!-- Exploit Box -->
    <rect x="14" y="155" width="208" height="150" rx="6" fill="#0F172A" stroke="#E11D48" stroke-width="1"/>
    <text x="22" y="175" class="badge" fill="#FDA4AF">CARA TEST &amp; BYPASS:</text>
    <text x="22" y="195" class="desc-text" font-size="10.5">Manfaatkan bug Cookie Injection</text>
    <text x="22" y="210" class="desc-text" font-size="10.5">(CRLF/Header injection):</text>
    
    <rect x="20" y="218" width="196" height="38" rx="4" fill="#4C0519" stroke="#F43F5E" stroke-width="1"/>
    <text x="24" y="233" class="code-text" font-size="8.5" fill="#FDA4AF">Set-Cookie: csrfKey=hackerKey</text>
    <text x="24" y="247" class="code-text" font-size="8.5" fill="#FEF08A">csrf=hackerMatchingToken</text>

    <text x="22" y="274" class="desc-text" font-size="10.5">Pasangan key + token cocok</text>
    <text x="22" y="290" class="desc-text" font-size="10.5">saat diproses di server!</text>

    <!-- Status -->
    <rect x="14" y="318" width="208" height="70" rx="6" fill="#E11D48" fill-opacity="0.1" stroke="#F43F5E" stroke-width="1"/>
    <text x="22" y="338" class="badge" fill="#FECDD3">✓ BYPASS SUKSES:</text>
    <text x="22" y="356" class="desc-text" font-size="10.5">Token dan csrfKey cocok,</text>
    <text x="22" y="372" class="desc-text" font-size="10.5">akun korban tetap tereksekusi.</text>
  </g>

</svg>
